
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vokabeltrainer</title>

<style>
body {font-family:Arial;text-align:center;margin:0;background:#eef3f8;}
.ui-btn{padding:14px 22px;margin:6px;border-radius:12px;border:none;background:#2d7df6;color:#fff;font-size:20px;font-weight:bold;}
.ui-btn.secondary{background:#5b6b7f;}
.mode-btn.active,.image-btn.active{background:#0b57d0;}
#menu,#folderMenu{height:100vh;display:flex;align-items:center;justify-content:center;}
#folderMenu,#app{display:none;}
.card{background:#fff;padding:30px;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,0.2);}
.bild{position:relative;max-width:900px;margin:auto;}
#bild{width:100%;}
#hotspots{position:absolute;inset:0;}
.hotspot{position:absolute;width:8%;height:8%;transform:translate(-50%,-50%);}
#label{position:absolute;background:#fff;border:2px solid #000;padding:8px 14px;font-size:26px;font-weight:bold;border-radius:12px;transform:translate(-50%,-50%);display:none;}
</style>
</head>

<body>

<div id="menu">
  <div class="card">
    <h1>Vokabeltrainer</h1>
    <button class="ui-btn" onclick="openFolder()">Strand</button>
  </div>
</div>

<div id="folderMenu">
  <div class="card">
    <h2>Strand</h2>
    <button class="ui-btn" onclick="openImage(0)">Bild 1</button>
    <button class="ui-btn" onclick="openImage(1)">Bild 2</button>
    <br><br>
    <button class="ui-btn secondary" onclick="backStart()">← Zurück</button>
  </div>
</div>

<div id="app">
  <button class="ui-btn secondary" onclick="backFolder()">← Zurück</button>
  <h2 id="title"></h2>

  <div>
    <button class="ui-btn image-btn" onclick="openImage(0)">Bild 1</button>
    <button class="ui-btn image-btn" onclick="openImage(1)">Bild 2</button>
  </div>

  <div>
    <button class="ui-btn mode-btn active" onclick="setMode('lernen')">Lernen</button>
    <button class="ui-btn mode-btn" onclick="setMode('quiz')">Quiz</button>
  </div>

  <div id="frage"></div>

  <div class="bild">
    <img id="bild">
    <div id="hotspots"></div>
    <div id="label"></div>
  </div>
</div>

<script>
const data = [
{
title:"Strand – Bild 1",
file:"strand-ohne-woerter.png",
hotspots:[
{wort:"el sol",x:70,y:26},
{wort:"la palmera",x:14,y:41},
{wort:"el mar",x:41,y:48}
]
},
{
title:"Strand – Bild 2",
file:"strand2.png?v=2",   // 🔥 HIER IST DIE LÖSUNG
hotspots:[
{wort:"el sol",x:28,y:18},
{wort:"la gaviota",x:69,y:18},
{wort:"el socorrista",x:72,y:43},
{wort:"el salvavidas",x:56,y:57},
{wort:"la sombrilla",x:18,y:50},
{wort:"la tumbona",x:23,y:69},
{wort:"el sombrero de sol",x:31,y:78},
{wort:"el castillo de arena",x:49,y:86},
{wort:"la niña",x:84,y:74},
{wort:"la pala",x:61,y:94},
{wort:"la pelota",x:77,y:93},
{wort:"el flotador",x:89,y:60}
]
}
];

let current=0;
let mode="lernen";
let gesucht="";

function openFolder(){
menu.style.display="none";
folderMenu.style.display="flex";
}

function backStart(){
folderMenu.style.display="none";
menu.style.display="flex";
}

function backFolder(){
app.style.display="none";
folderMenu.style.display="flex";
}

function openImage(i){
current=i;
folderMenu.style.display="none";
menu.style.display="none";
app.style.display="block";
load();
}

function setMode(m){
mode=m;
load();
}

function load(){
const d=data[current];
title.textContent=d.title;
bild.src=d.file;

hotspots.innerHTML="";
label.style.display="none";

d.hotspots.forEach(h=>{
const div=document.createElement("div");
div.className="hotspot";
div.style.left=h.x+"%";
div.style.top=h.y+"%";

div.onclick=()=>{
if(mode==="lernen"){
label.textContent=h.wort;
label.style.left=h.x+"%";
label.style.top=(h.y-5)+"%";
label.style.display="block";
}else{
if(h.wort===gesucht){
alert("Richtig!");
next();
}else{
alert("Falsch!");
}
}
};

hotspots.appendChild(div);
});

if(mode==="quiz") next();
}

function next(){
const list=data[current].hotspots;
gesucht=list[Math.floor(Math.random()*list.length)].wort;
frage.textContent="Finde: "+gesucht;
}
</script>

</body>
</html>

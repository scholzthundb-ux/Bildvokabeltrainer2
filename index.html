<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Vokabeltrainer</title>

  <style>
    :root {
      --bg-top: #f7f4ec;
      --bg-bottom: #dce8f4;
      --panel: rgba(255, 255, 255, 0.78);
      --panel-strong: rgba(255, 255, 255, 0.92);
      --panel-border: rgba(255, 255, 255, 0.72);
      --text-main: #1f2a37;
      --text-soft: #5f6c7d;
      --accent: #2f5fcf;
      --accent-dark: #2146a2;
      --accent-soft: #dbe6fb;
      --shadow-soft: 0 14px 34px rgba(31, 42, 55, 0.12);
      --shadow-strong: 0 18px 36px rgba(47, 95, 207, 0.22);
      --shell-width: min(100%, 820px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
      text-align: center;
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.92), transparent 36%),
        radial-gradient(circle at top right, rgba(233,240,255,0.86), transparent 28%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text-main);
    }

    h1, h2, h3 { margin: 0; }

    .ui-btn {
      padding: 20px 28px;
      margin: 0;
      border-radius: 20px;
      border: none;
      background: linear-gradient(180deg, #3d71e4 0%, var(--accent) 100%);
      color: white;
      font-size: clamp(1.1rem, 2.4vw, 1.55rem);
      font-weight: 800;
      letter-spacing: 0.01em;
      cursor: pointer;
      box-shadow: var(--shadow-strong);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }

    .ui-btn:hover {
      filter: brightness(1.03);
    }

    .ui-btn:active { transform: scale(0.98); }

    .ui-btn.secondary {
      background: linear-gradient(180deg, #6d7d90 0%, #556476 100%);
      box-shadow: 0 10px 22px rgba(85, 100, 118, 0.2);
    }

    .ui-btn.small {
      font-size: 1rem;
      padding: 14px 18px;
    }

    .ui-btn.image-number {
      font-size: 1.1rem;
      padding: 14px 18px;
      min-width: 64px;
      min-height: 60px;
      border-radius: 18px;
    }

    #menu {
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: clamp(18px, 4vw, 36px);
      overflow: visible;
      position: relative;
      isolation: isolate;
    }

    #menu::before,
    #menu::after {
      content: "";
      position: fixed;
      inset: auto;
      z-index: -1;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(6px);
    }

    #menu::before {
      width: 280px;
      height: 280px;
      top: 22px;
      left: -70px;
      background: radial-gradient(circle, rgba(255, 210, 138, 0.38) 0%, rgba(255, 210, 138, 0) 72%);
    }

    #menu::after {
      width: 360px;
      height: 360px;
      right: -120px;
      bottom: 50px;
      background: radial-gradient(circle, rgba(98, 146, 255, 0.24) 0%, rgba(98, 146, 255, 0) 72%);
    }

    #app {
      display: none;
    }

    .card {
      background: linear-gradient(180deg, var(--panel-strong) 0%, var(--panel) 100%);
      width: 100%;
      max-width: 720px;
      border-radius: 30px;
      padding: clamp(24px, 4vw, 40px);
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      margin: 0 auto;
      flex: 0 0 auto;
    }

    .menu-card {
      position: relative;
      overflow: hidden;
      max-width: 760px;
      padding: clamp(24px, 4vw, 42px);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.96) 0%, rgba(248, 250, 255, 0.88) 100%);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow:
        0 24px 60px rgba(31, 42, 55, 0.14),
        inset 0 1px 0 rgba(255,255,255,0.86);
    }

    .menu-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 150px;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.72), transparent 46%),
        linear-gradient(135deg, rgba(255, 229, 172, 0.52) 0%, rgba(145, 185, 255, 0.28) 100%);
      pointer-events: none;
    }

    .menu-card > * {
      position: relative;
      z-index: 1;
    }

    .menu-hero {
      padding: 6px 0 12px;
      margin-bottom: 14px;
    }

    .start-icon {
      width: 94px;
      height: 94px;
      margin: 8px auto 18px;
      border-radius: 32px;
      display: grid;
      place-items: center;
      font-size: 48px;
      background:
        radial-gradient(circle at 30% 25%, rgba(255,255,255,0.9), transparent 34%),
        linear-gradient(160deg, rgba(255, 211, 133, 0.82) 0%, rgba(72, 122, 236, 0.92) 100%);
      box-shadow:
        0 18px 34px rgba(47, 95, 207, 0.2),
        inset 0 1px 0 rgba(255,255,255,0.82);
    }

    h1 {
      font-size: clamp(1.2rem, 3.2vw, 2.2rem);
      letter-spacing: -0.03em;
    }

    .subtitle {
      font-size: clamp(1rem, 2.8vw, 1.45rem);
      margin-top: 14px;
      margin-bottom: 30px;
      color: var(--text-soft);
      line-height: 1.4;
      min-height: calc(1.4em * 2);
    }

    .menu-actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      width: 100%;
    }

    .menu-folder-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      padding: 10px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(223, 233, 251, 0.62) 0%, rgba(244, 247, 255, 0.88) 100%);
      border: 1px solid rgba(197, 213, 240, 0.72);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.82);
    }

    .menu-folder-group.is-open {
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.82),
        0 16px 30px rgba(31, 42, 55, 0.08);
    }

    .menu-folder-group > .ui-btn,
    .folder-open-btn {
      width: 100%;
      text-align: left;
      justify-content: flex-start;
      position: relative;
      min-height: 74px;
      padding: 16px 50px 16px 62px;
      border-radius: 24px;
      font-size: clamp(0.96rem, 2.05vw, 1.18rem);
      line-height: 1.15;
      overflow: hidden;
      color: #243348;
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow:
        0 14px 26px rgba(31, 42, 55, 0.1),
        inset 0 1px 0 rgba(255,255,255,0.75);
    }

    .folder-open-btn::before {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 24px;
      line-height: 1;
      opacity: 0.95;
    }

    .folder-open-btn::after {
      content: "→";
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 21px;
      font-weight: 900;
      opacity: 0.88;
    }

    #mainHabitacionesBtn::after {
      content: "▾";
      transform: translateY(-50%);
      transition: transform 0.18s ease;
    }

    #mainHabitacionesBtn.is-expanded::after {
      transform: translateY(-50%) rotate(180deg);
    }

    .folder-open-btn[data-folder="zahlen"]::before { content: "🔢"; }
    .folder-open-btn[data-folder="playa"]::before { content: "🏖️"; }
    .folder-open-btn[data-folder="ropa"]::before { content: "👕"; }
    .folder-open-btn[data-folder="rutina"]::before { content: "⏰"; }
    .folder-open-btn[data-folder="casa"]::before { content: "🏡"; }
    .folder-open-btn[data-folder="habitaciones"]::before { content: "🚪"; }

    .folder-open-btn[data-folder="zahlen"] {
      background: linear-gradient(180deg, #ffe8cc 0%, #ffd9ae 100%);
    }

    .folder-open-btn[data-folder="playa"] {
      background: linear-gradient(180deg, #fff1b8 0%, #ffe08a 100%);
    }

    .folder-open-btn[data-folder="ropa"] {
      background: linear-gradient(180deg, #ffd6e7 0%, #ffc2db 100%);
    }

    .folder-open-btn[data-folder="rutina"] {
      background: linear-gradient(180deg, #d9f2d9 0%, #c3e8c3 100%);
    }

    .folder-open-btn[data-folder="casa"] {
      background: linear-gradient(180deg, #d9e7ff 0%, #c6dafb 100%);
    }

    .folder-open-btn[data-folder="habitaciones"] {
      background: linear-gradient(180deg, #dff3ef 0%, #cce9e2 100%);
      box-shadow:
        0 18px 34px rgba(32, 92, 85, 0.12),
        inset 0 1px 0 rgba(255,255,255,0.78);
    }

    .submenu-actions {
      display: grid;
      gap: 9px;
      width: 100%;
      padding-left: 12px;
    }

    .submenu-folder-open-btn {
      width: 100%;
      justify-self: stretch;
      text-align: left;
      font-size: clamp(0.88rem, 1.8vw, 1rem);
      padding: 11px 14px 11px 16px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(231, 238, 250, 0.94) 100%);
      color: #26374d;
      box-shadow: 0 10px 18px rgba(31, 42, 55, 0.09);
      border: 1px solid rgba(208, 220, 244, 0.84);
      position: relative;
    }

    .submenu-folder-open-btn[data-folder="habitaciones"] {
      background: linear-gradient(180deg, #eef6ff 0%, #ddeafd 100%);
    }

    .submenu-folder-open-btn[data-folder="desvan"] {
      background: linear-gradient(180deg, #efe3d3 0%, #e4d0b7 100%);
    }

    .submenu-folder-open-btn[data-folder="cuartoNinos"] {
      background: linear-gradient(180deg, #ffe3ef 0%, #ffd2e6 100%);
    }

    .submenu-folder-open-btn[data-folder="dormitorio"] {
      background: linear-gradient(180deg, #e7dcff 0%, #d9c9fb 100%);
    }

    .submenu-folder-open-btn[data-folder="salon"] {
      background: linear-gradient(180deg, #ffe7c7 0%, #ffd8a6 100%);
    }

    .submenu-folder-open-btn[data-folder="comedor"] {
      background: linear-gradient(180deg, #f7e7cb 0%, #edd5a7 100%);
    }

    .submenu-folder-open-btn[data-folder="cocina"] {
      background: linear-gradient(180deg, #ffe4d8 0%, #ffd2be 100%);
    }

    .submenu-folder-open-btn[data-folder="bano"] {
      background: linear-gradient(180deg, #dff4ff 0%, #ccecff 100%);
    }

    .submenu-folder-open-btn[data-folder="pasillo"] {
      background: linear-gradient(180deg, #f3efd9 0%, #e8e0ba 100%);
    }

    .submenu-folder-open-btn[data-folder="despacho"] {
      background: linear-gradient(180deg, #dde6f8 0%, #ccd8f0 100%);
    }

    .submenu-folder-open-btn[data-folder="lavadero"] {
      background: linear-gradient(180deg, #def3f7 0%, #cbe9ef 100%);
    }

    .submenu-folder-open-btn[data-folder="sotano"] {
      background: linear-gradient(180deg, #e4e1f1 0%, #d3cee8 100%);
    }

    .submenu-folder-open-btn[data-folder="trastero"] {
      background: linear-gradient(180deg, #f3e8d8 0%, #e8d7be 100%);
    }

    .submenu-folder-open-btn::before {
      content: "•";
      margin-right: 10px;
      color: #2f796f;
      font-size: 1.1em;
    }

    .submenu-folder-open-btn:hover {
      filter: brightness(1.02);
    }

    .menu-utility-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 4px;
    }

    .menu-utility-row .ui-btn {
      width: auto;
      border-radius: 999px;
      padding-inline: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(231, 238, 250, 0.96) 100%);
      color: #2b415e;
      border: 1px solid rgba(207, 220, 244, 0.9);
      box-shadow: 0 10px 20px rgba(31, 42, 55, 0.08);
    }

    .folder-title {
      font-size: clamp(1.8rem, 4.8vw, 2.8rem);
      margin-bottom: 18px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .folder-subtitle {
      font-size: clamp(1rem, 2.8vw, 1.35rem);
      color: var(--text-soft);
      margin-bottom: 28px;
    }

    .app-wrap {
      width: var(--shell-width);
      margin: 0 auto;
      padding:
        max(14px, env(safe-area-inset-top))
        clamp(12px, 3vw, 20px)
        max(18px, env(safe-area-inset-bottom));
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin: 0 auto 12px;
    }

    .current-title {
      display: block;
      flex: 1 1 auto;
      min-width: 0;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
      color: var(--text-soft);
      font-size: clamp(0.9rem, 2.3vw, 1rem);
      font-weight: 700;
      text-align: center;
      box-shadow: 0 8px 22px rgba(31, 42, 55, 0.08);
      backdrop-filter: blur(10px);
    }

    .mode-switch {
      display: flex;
      width: 100%;
      margin: 0 auto 10px;
      background: rgba(219, 230, 251, 0.82);
      border-radius: 28px;
      padding: 6px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.66),
        0 10px 24px rgba(31, 42, 55, 0.08);
      backdrop-filter: blur(10px);
    }

    .mode-segment {
      flex: 1;
      border: none;
      background: transparent;
      color: #26374d;
      font-size: clamp(1.15rem, 2.7vw, 1.7rem);
      font-weight: 800;
      padding: 18px 10px;
      border-radius: 22px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .mode-segment.active {
      background: linear-gradient(180deg, #416fdb 0%, var(--accent) 100%);
      color: white;
      box-shadow: 0 8px 18px rgba(47, 95, 207, 0.3);
    }

    .mode-segment:active {
      transform: scale(0.98);
    }

    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin: 0 auto 10px;
      padding: 0;
      flex-wrap: nowrap;
    }

    .nav-left,
    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-left {
      flex: 0 0 auto;
    }

    .nav-right {
      flex: 0 0 auto;
      justify-content: flex-end;
      margin-left: auto;
    }

    .nav-arrow-btn {
      position: relative;
      background: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(244, 247, 252, 0.88) 100%);
      color: #32445c;
      border: 1px solid rgba(255,255,255,0.88);
      width: 58px;
      height: 52px;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 10px 24px rgba(31, 42, 55, 0.1),
        inset 0 1px 0 rgba(255,255,255,0.75);
      backdrop-filter: blur(10px);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .nav-arrow-btn::before {
      content: "←";
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
      transform: translateX(-1px);
    }

    .nav-arrow-btn:hover {
      background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(237, 242, 249, 0.94) 100%);
      box-shadow:
        0 12px 28px rgba(31, 42, 55, 0.14),
        inset 0 1px 0 rgba(255,255,255,0.9);
    }

    .nav-arrow-btn:active {
      transform: scale(0.95);
    }

    .nav-arrow-btn.is-next::before {
      content: "→";
      transform: translateX(1px);
    }

    #backToFolderBtn {
      width: auto;
      min-width: 96px;
      padding: 0 14px 0 12px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(180deg, #3d71e4 0%, var(--accent-dark) 100%);
      color: white;
      gap: 8px;
      box-shadow: 0 8px 18px rgba(47, 95, 207, 0.22);
    }

    #backToFolderBtn::before {
      content: "↩";
      font-size: 19px;
      font-weight: 900;
      transform: none;
    }

    #backToFolderBtn::after {
      content: attr(data-label);
      font-size: 0.84rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      line-height: 1;
    }

    #backToFolderBtn:hover {
      background: linear-gradient(180deg, #4b7bf0 0%, #2850b6 100%);
      box-shadow: 0 10px 22px rgba(47, 95, 207, 0.28);
    }

    .nav-arrow-btn:disabled {
      opacity: 0.45;
      cursor: default;
      box-shadow:
        0 6px 18px rgba(31, 42, 55, 0.06),
        inset 0 1px 0 rgba(255,255,255,0.6);
    }

    .nav-arrow-btn:disabled:active {
      transform: none;
    }

    #backToFolderBtn:disabled {
      background: linear-gradient(180deg, #8a97ab 0%, #6d7a8d 100%);
      box-shadow: 0 6px 18px rgba(31, 42, 55, 0.08);
    }

    .fullscreen-btn,
    .mute-btn,
    .lang-toggle-btn {
      background: linear-gradient(180deg, #3d71e4 0%, var(--accent-dark) 100%);
      color: white;
      border: none;
      font-size: 0.84rem;
      font-weight: 800;
      padding: 9px 12px;
      min-height: 38px;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(47, 95, 207, 0.22);
      white-space: nowrap;
    }

    .fullscreen-btn:active,
    .mute-btn:active,
    .lang-toggle-btn:active {
      transform: scale(0.97);
    }

    .mute-btn.is-muted {
      background: #5b6b7f;
    }

    .mode-status-area {
      position: relative;
      height: clamp(82px, 12vh, 116px);
      margin: 0 0 10px;
    }

    .mode-panel {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .mode-panel.is-active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #learnPanel {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
    }

    .swipe-info {
      font-size: 0.98rem;
      color: var(--text-soft);
      margin: 4px 0 0;
    }

    .swipe-info.is-hidden {
      visibility: hidden;
    }

    #quizBox {
      margin: 0;
      padding: 0;
    }

    .quiz-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 0 0 8px;
      flex-wrap: wrap;
    }

    #frage {
      font-size: clamp(1.45rem, 4vw, 2.05rem);
      margin: 0;
      font-weight: 800;
      line-height: 1.2;
      max-width: min(100%, 620px);
      text-align: center;
    }

    .sound-btn {
      border: none;
      background: linear-gradient(180deg, #3d71e4 0%, var(--accent-dark) 100%);
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(47, 95, 207, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .sound-btn:active {
      transform: scale(0.95);
    }

    .sound-btn.is-off {
      opacity: 0.6;
      box-shadow: 0 6px 14px rgba(47, 95, 207, 0.14);
    }

    #feedback {
      font-size: clamp(1.5rem, 4.4vw, 2.1rem);
      font-weight: 800;
      min-height: 34px;
      margin: 0;
      line-height: 1.2;
    }

    .bild {
      position: relative;
      --zoom-origin-x: 50%;
      --zoom-origin-y: 50%;
      width: 100%;
      max-width: 100%;
      height: min(74vh, calc(100dvh - 270px));
      margin: 0 auto;
      touch-action: pan-y;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.74);
      border-radius: 30px;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(255,255,255,0.68);
    }

    #bild {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    #zoomRevealCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      z-index: 9;
      pointer-events: none;
    }

    .bild.reveal-pending #bild,
    .bild.reveal-pending #hotspots,
    .bild.zoom-canvas-active #bild,
    .bild.zoom-canvas-active #hotspots {
      opacity: 0;
    }

    .bild.zoom-canvas-active .hotspot {
      pointer-events: none;
    }

    #hotspots {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    #specialImageLabel {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 19;
      display: none;
      max-width: min(320px, 68vw);
      padding: 9px 15px;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.97) 0%, rgba(247,247,247,0.95) 100%);
      border: 3px solid #172334;
      color: #172334;

      background: transparent;
      border: none;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: none;
      cursor: pointer;
      width: clamp(28px, 7vw, 54px);
      height: clamp(28px, 7vw, 54px);
      pointer-events: auto;

      outline: none;
      background: transparent;
      box-shadow: none;
    }

      background: rgba(255,0,0,0.28);
      border: 2px solid red;
      border-radius: 10px;
    }

      border-radius: 20px;
      padding: 10px 18px;
      font-size: clamp(22px, 4.2vw, 32px);

      color: #172334;

      transform: translate(-50%, -50%);

      z-index: 20;
      white-space: normal;
      overflow-wrap: break-word;
      word-break: keep-all;
      text-align: center;
      box-shadow: 0 10px 22px rgba(0,0,0,0.24);
      pointer-events: none;
      max-width: min(260px, 58vw);
    }

      0% {
        transform: translate(-50%, -50%) scale(0.85);
        opacity: 0;
      }
      100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }

      animation: slideOutLeft 0.22s ease forwards;
    }

    #bild.slide-out-right {
      animation: slideOutRight 0.22s ease forwards;
    }

    #bild.slide-in-left {
      animation: slideInLeft 0.22s ease forwards;
    }

      animation: slideInRight 0.22s ease forwards;

    @keyframes slideOutLeft {
      0% { transform: translateX(0); opacity: 1; }
      100% { transform: translateX(-28px); opacity: 0.35; }

    @keyframes slideOutRight {
      0% { transform: translateX(0); opacity: 1; }
      100% { transform: translateX(28px); opacity: 0.35; }

      0% { transform: translateX(28px); opacity: 0.35; }
      100% { transform: translateX(0); opacity: 1; }

    function saveCurrentLanguage() {
      try {
        localStorage.setItem("trainerLanguage", currentLanguage);
      } catch (err) {
        // Lokales Speichern ist optional.
      }
    }

    function getLanguageCandidates(lang = currentLanguage) {
      const primaryCandidates = {
        "en-us": ["en-us", "en"],
        en: ["en", "en-us"],
        es: ["es"],
        de: ["de"],
        ru: ["ru"]
      };

      return [...new Set([...(primaryCandidates[lang] || [lang]), "es", "de", "en", "en-us", "ru"])];
    }

    function sameLanguageFamily(firstLang, secondLang) {
      return String(firstLang).split("-")[0] === String(secondLang).split("-")[0];
    }

    function resolveLocalizedEntry(value, lang = currentLanguage) {
      if (value == null) {
        return { text: "", lang: "es" };
      }

      if (typeof value === "string") {
        return { text: value, lang: "es" };
      }

      if (typeof value === "object") {
        for (const candidate of getLanguageCandidates(lang)) {
          if (typeof value[candidate] === "string") {
            return {
              text: value[candidate],
              lang: sameLanguageFamily(lang, candidate) ? lang : candidate
            };
          }
        }

        const fallbackEntry = Object.entries(value).find(([, entry]) => typeof entry === "string");

        if (fallbackEntry) {
          return { text: fallbackEntry[1], lang: fallbackEntry[0] };
        }
      }

      return { text: String(value), lang };
    }

    function resolveLocalizedText(value, lang = currentLanguage) {
      return resolveLocalizedEntry(value, lang).text;
    }

    function getUi(key) {
      for (const candidate of getLanguageCandidates(currentLanguage)) {
        if (UI_STRINGS[candidate]?.[key]) {
          return UI_STRINGS[candidate][key];
        }
      }

      return key;
    }

    function formatLearnInfoText(text) {
      return currentLanguage === "es" ? text : `${text}\n\u00A0`;
    }

    function setLearnInfoText(text) {
      lernInfo.textContent = formatLearnInfoText(text);
    }

    function getHotspotText(hotspot) {
      return resolveLocalizedText(hotspot?.wort);
    }

    function getHotspotQuizKey(hotspot) {
      const baseText = resolveLocalizedText(hotspot?.wort, "es");

      return baseText
        .normalize("NFC")
        .trim()
        .toLowerCase();
    }

    function getUniqueQuizHotspots(imageData) {
      const seenKeys = new Set();
      const uniqueHotspots = [];

      (imageData?.hotspots || []).forEach((hotspot) => {
        const key = getHotspotQuizKey(hotspot);

        if (!key || seenKeys.has(key)) return;

        seenKeys.add(key);
        uniqueHotspots.push(hotspot);
      });

      return uniqueHotspots;
    }

    function getFolderDisplayTitle(folderKey) {
      const translatedTitle = FOLDER_TITLE_TRANSLATIONS[folderKey];

      if (translatedTitle) {
        return resolveLocalizedText(translatedTitle);
      }

      return resolveLocalizedText(folders[folderKey]?.title ?? "");
    }

    function getHabitacionesSubfolderEntries() {
      const firstImage = folders.habitaciones?.images?.[0];
      const uniqueEntries = new Map();
      const preferredOrder = [
        "desvan",
        "cuartoNinos",
        "dormitorio",
        "salon",
        "comedor",
        "cocina",
        "bano",
        "pasillo",
        "despacho",
        "lavadero",
        "sotano",
        "trastero"
      ];

      (firstImage?.hotspots || []).forEach((hotspot) => {
        if (!hotspot.openFolderKey || uniqueEntries.has(hotspot.openFolderKey)) return;
        uniqueEntries.set(hotspot.openFolderKey, hotspot.wort ?? folders[hotspot.openFolderKey]?.title ?? hotspot.openFolderKey);
      });

      const orderedEntries = [];

      preferredOrder.forEach((folderKey) => {
        if (!uniqueEntries.has(folderKey)) return;
        orderedEntries.push({ folderKey, label: uniqueEntries.get(folderKey) });
        uniqueEntries.delete(folderKey);
      });

      uniqueEntries.forEach((label, folderKey) => {
        orderedEntries.push({ folderKey, label });
      });

      return orderedEntries;
    }

    function toggleHabitacionesSubmenu() {
      habitacionesSubmenuExpanded = !habitacionesSubmenuExpanded;
      renderHabitacionesSubmenu();
    }

    function renderHabitacionesSubmenu() {
      if (!habitacionesSubmenu) return;

      habitacionesSubmenu.innerHTML = "";
      const hasExpandedEntries = habitacionesSubmenuExpanded;

      mainHabitacionesBtn.classList.toggle("is-expanded", hasExpandedEntries);
      mainHabitacionesBtn.setAttribute("aria-expanded", hasExpandedEntries ? "true" : "false");
      habitacionesMenuGroup.classList.toggle("is-open", hasExpandedEntries);
      habitacionesSubmenu.hidden = !hasExpandedEntries;

      if (!hasExpandedEntries) return;

      const mainButton = document.createElement("button");
      mainButton.type = "button";
      mainButton.className = "ui-btn submenu-folder-open-btn";
      mainButton.dataset.folder = "habitaciones";
      mainButton.textContent = getFolderDisplayTitle("habitaciones");
      mainButton.addEventListener("click", () => openFolder("habitaciones"));
      habitacionesSubmenu.appendChild(mainButton);

      getHabitacionesSubfolderEntries().forEach(({ folderKey, label }) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "ui-btn submenu-folder-open-btn";
        button.dataset.folder = folderKey;
        button.textContent = resolveLocalizedText(label);
        button.addEventListener("click", () => openFolder(folderKey));
        habitacionesSubmenu.appendChild(button);
      });

    function getLanguageButtonText() {
      return `🌐 ${LANGUAGE_LABELS[currentLanguage]}`;
    }

    function cycleLanguage() {
      const currentIndex = LANGUAGE_ORDER.indexOf(currentLanguage);
      currentLanguage = LANGUAGE_ORDER[(currentIndex + 1) % LANGUAGE_ORDER.length];
      saveCurrentLanguage();
      applyLanguage();

    function updateLanguageButtons() {
      const buttonText = getLanguageButtonText();
      const ariaLabel = getUi("switchLanguage");

      menuLanguageBtn.textContent = buttonText;
      menuLanguageBtn.setAttribute("aria-label", ariaLabel);
      menuLanguageBtn.title = ariaLabel;

      appLanguageBtn.setAttribute("aria-label", ariaLabel);
      appLanguageBtn.title = ariaLabel;
    }

      backToFolderBtn.setAttribute("aria-label", getUi("backToMenu"));

      document.documentElement.lang = LANGUAGE_HTML_CODES[currentLanguage] ?? currentLanguage;
      document.title = getUi("appTitle");
      menuTitle.textContent = getUi("appTitle");
      menuSubtitle.textContent = getUi("subtitle");

      updateSpecialImageLabel();

        positionLabelElement(label, currentLabelHotspot);

      learnPanel.classList.toggle("is-active", isLearnMode);

        updateImageDisplay();
        buildHotspots();
        updateSpecialImageLabel();

        if (mode === "lernen" && !isZoomOpen() && !currentLabelHotspot) {
          showImageOpenLabelIfNeeded();

      refreshDisplayedLayout();

      muteBtn.classList.toggle("is-muted", isMuted);

    function updateCurrentTitle() {
      const total = folders[currentFolderKey].images.length;
      currentImageTitle.textContent = `${getFolderDisplayTitle(currentFolderKey)} · ${getUi("image")} ${currentImageIndex + 1} ${getUi("of")} ${total}`;

    function updateImageNavButtons() {
      const total = folders[currentFolderKey].images.length;
      const canNavigate = total > 1 && !isZoomOpen();

      prevImageBtn.disabled = !canNavigate;
      nextImageBtn.disabled = !canNavigate;
    }

    function openFolder(folderKey) {
      clearPendingLearnHotspotAction();
      silentAfterDoubleClick = false;
      folderNavigationStack = [];
      currentFolderKey = folderKey;
      currentImageIndex = 0;
      openImage(0);
    }

    function openNestedFolder(folderKey, triggerHotspot = null) {
      clearPendingLearnHotspotAction();
      clearTimeout(timer);
      timer = null;
      silentAfterDoubleClick = false;

      folderNavigationStack.push({
        folderKey: currentFolderKey,
        imageIndex: currentImageIndex
      });

      if (triggerHotspot) {
        prepareZoomReveal(triggerHotspot);
      }

      currentFolderKey = folderKey;
      currentImageIndex = 0;
      openImage(0, { preservePendingReveal: !!triggerHotspot });
    }

    async function backToStart(options = {}) {
      const silent = !!options.silent;
      clearPendingLearnHotspotAction();

      if (isZoomOpen()) {
        closeZoomImage();
        return;
      }

      if (folderNavigationStack.length > 0) {
        const previousView = folderNavigationStack.pop();
        silentAfterDoubleClick = silent;
        currentFolderKey = previousView.folderKey;
        currentImageIndex = previousView.imageIndex;
        openImage(previousView.imageIndex);
        return;
      }

      app.style.display = "none";
      menu.style.display = "flex";
      habitacionesSubmenuExpanded = false;
      renderHabitacionesSubmenu();

      clearTimeout(timer);
      timer = null;

      hideLabel();
      hideSpecialImageLabel();
      feedback.textContent = "";
      feedback.className = "";

      stopSpeech();
      silentAfterDoubleClick = false;
      await exitFullscreen();
    }

    async function openImage(index, options = {}) {
      const preservePendingReveal = !!options.preservePendingReveal;
      clearPendingLearnHotspotAction();

      currentImageIndex = index;
      activeZoomHotspot = null;
      clearZoomReveal(!preservePendingReveal);

      if (preservePendingReveal) {
        bildContainer.classList.add("reveal-pending");
      } else {
        bildContainer.classList.remove("reveal-pending");
      }

      menu.style.display = "none";
      app.style.display = "block";

      mode = "lernen";
      currentQuestionHotspot = null;
      gesucht = "";
      quizAktiv = false;

      clearTimeout(timer);
      timer = null;

      updateModeButtons();
      updateMuteButton();
      updateImageNavButtons();
      loadCurrentImage();

      setTimeout(async () => {
        await enterFullscreen();
      }, 120);
    }

    function updateModeButtons() {
      lernBtn.classList.toggle("active", mode === "lernen");
      quizBtn.classList.toggle("active", mode === "quiz");
    }

    function resetQuizQueues() {
      quizQueue = [];
      repeatQueue = [];
      recentQuestions = [];
      refillQuizQueue();
    }

    function updateLernInfo() {
      if (currentFolderKey === "ropa") {
        setLearnInfoText(getUi("learnInfoClothes"));
        return;
      }

      if (currentFolderKey === "rutina") {
        setLearnInfoText(getUi("learnInfoRoutine"));
        return;
      }

      if (currentFolderKey === "casa") {
        setLearnInfoText(isZoomOpen()
          ? ""
          : getUi("learnInfoHouse"));
        return;
      }

      if (currentFolderKey === "playa" && (currentImageIndex === 2 || currentImageIndex === 3)) {
        setLearnInfoText(getUi("learnInfoActivity"));
        return;
      }

      setLearnInfoText(getUi("learnInfoDefault"));

    function buildFreshImageSrc(file) {
      const separator = file.includes("?") ? "&" : "?";
      return `${file}${separator}v=${Date.now()}`;
    }

    function loadCurrentImage(afterLoadAction = null) {
      const imageData = getDisplayedImageData();

      updateCurrentTitle();
      feedback.textContent = "";
      feedback.className = "";

      hideLabel();
      hideSpecialImageLabel();
      updateLernInfo();

      bild.onload = () => {
        setTimeout(() => {
          updateImageDisplay();
          buildHotspots();
          updateSpecialImageLabel();

          if (mode === "lernen") {
            updateModePanels();
            showImageOpenLabelIfNeeded();
          } else {
            updateModePanels();
            resetQuizQueues();
            nextQuestion();
          }

          updateModeButtons();
          updateMuteButton();
          updateImageNavButtons();

          runAfterImageLoad(afterLoadAction);
        }, 60);
      };

      bild.src = buildFreshImageSrc(imageData.file);
    }

    function clearZoomReveal(clearPending = true) {
      if (zoomRevealTimer) {
        clearTimeout(zoomRevealTimer);
        zoomRevealTimer = null;
      }

      if (zoomRevealFrame) {
        cancelAnimationFrame(zoomRevealFrame);
        zoomRevealFrame = null;
      }

      bildContainer.classList.remove("zoom-canvas-active");
      bildContainer.classList.remove("reveal-pending");
      bildContainer.style.removeProperty("--zoom-origin-x");
      bildContainer.style.removeProperty("--zoom-origin-y");

      zoomRevealCanvas.style.display = "none";
      zoomRevealCtx.clearRect(0, 0, zoomRevealCanvas.width, zoomRevealCanvas.height);

      if (clearPending) {
        pendingZoomReveal = null;
      }
    }

    function prepareZoomReveal(hotspot) {
      const rect = bildContainer.getBoundingClientRect();
      const originX = rect.width
        ? Math.max(0, Math.min(100, (imagePercentToPixelX(hotspot.clickX) / rect.width) * 100))
        : 50;
      const originY = rect.height
        ? Math.max(0, Math.min(100, (imagePercentToPixelY(hotspot.clickY) / rect.height) * 100))
        : 50;

      clearZoomReveal(false);
      pendingZoomReveal = {
        originX: `${originX}%`,
        originY: `${originY}%`
      };
    }

    function runAfterImageLoad(afterLoadAction) {
      if (!pendingZoomReveal) {
        if (afterLoadAction) {
          afterLoadAction();
        }
        return;
      }

      const revealOrigin = pendingZoomReveal;
      pendingZoomReveal = null;

      startZoomReveal(revealOrigin, afterLoadAction);
    }

    function drawZoomRevealFrame(originX, originY, radius) {
      const width = zoomRevealCanvas.width / (window.devicePixelRatio || 1);
      const height = zoomRevealCanvas.height / (window.devicePixelRatio || 1);

      zoomRevealCtx.clearRect(0, 0, width, height);
      zoomRevealCtx.save();
      zoomRevealCtx.beginPath();
      zoomRevealCtx.arc(originX, originY, radius, 0, Math.PI * 2);
      zoomRevealCtx.clip();
      zoomRevealCtx.drawImage(bild, imageDisplay.x, imageDisplay.y, imageDisplay.w, imageDisplay.h);
      zoomRevealCtx.restore();
    }

    function startZoomReveal(revealOrigin, afterLoadAction) {
      const rect = bildContainer.getBoundingClientRect();
      const width = Math.max(1, Math.round(rect.width));
      const height = Math.max(1, Math.round(rect.height));
      const devicePixelRatio = window.devicePixelRatio || 1;
      const originX = (parseFloat(revealOrigin.originX) / 100) * width;
      const originY = (parseFloat(revealOrigin.originY) / 100) * height;
      const maxRadius = Math.max(
        Math.hypot(originX, originY),
        Math.hypot(width - originX, originY),
        Math.hypot(originX, height - originY),
        Math.hypot(width - originX, height - originY)
      );

      zoomRevealCanvas.width = Math.round(width * devicePixelRatio);
      zoomRevealCanvas.height = Math.round(height * devicePixelRatio);
      zoomRevealCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      zoomRevealCanvas.style.display = "block";
      bildContainer.classList.add("zoom-canvas-active");

      let startTime = null;

      const animate = (timestamp) => {
        if (startTime === null) {
          startTime = timestamp;
        }

        const progress = Math.min(1, (timestamp - startTime) / ZOOM_REVEAL_DURATION);
        const easedProgress = 1 - Math.pow(1 - progress, 3);
        drawZoomRevealFrame(originX, originY, maxRadius * easedProgress);

        if (progress < 1) {
          zoomRevealFrame = requestAnimationFrame(animate);
          return;
        }

        zoomRevealFrame = null;
        zoomRevealTimer = setTimeout(() => {
          clearZoomReveal(false);

          if (afterLoadAction) {
            afterLoadAction();
          }
        }, 30);
      };

      drawZoomRevealFrame(originX, originY, 0.1);
      zoomRevealFrame = requestAnimationFrame(animate);
    }

    function updateImageDisplay() {
      const rect = bild.getBoundingClientRect();

      if (!bild.naturalWidth || !bild.naturalHeight || !rect.width || !rect.height) {
        imageDisplay = {
          x: 0,
          y: 0,
          w: rect.width || 0,
          h: rect.height || 0
        };
        return;
      }

      const imgRatio = bild.naturalWidth / bild.naturalHeight;
      const boxRatio = rect.width / rect.height;

      if (imgRatio > boxRatio) {
        imageDisplay.w = rect.width;
        imageDisplay.h = rect.width / imgRatio;
        imageDisplay.x = 0;
        imageDisplay.y = (rect.height - imageDisplay.h) / 2;
      } else {
        imageDisplay.h = rect.height;
        imageDisplay.w = rect.height * imgRatio;
        imageDisplay.y = 0;
        imageDisplay.x = (rect.width - imageDisplay.w) / 2;
      }
    }

    function imagePercentToPixelX(percentX) {
      return imageDisplay.x + (percentX / 100) * imageDisplay.w;
    }

    function imagePercentToPixelY(percentY) {
      return imageDisplay.y + (percentY / 100) * imageDisplay.h;
    }

    function buildHotspots() {
      updateImageDisplay();
      hotspotsLayer.innerHTML = "";

      getDisplayedImageData().hotspots.forEach((h) => {
        const d = document.createElement("button");

        d.className = "hotspot";
        d.type = "button";
        d.style.left = imagePercentToPixelX(h.clickX) + "px";
        d.style.top = imagePercentToPixelY(h.clickY) + "px";

        if (h.areaW) {
          d.style.width = (imageDisplay.w * h.areaW) / 100 + "px";
        }

        if (h.areaH) {
          d.style.height = (imageDisplay.h * h.areaH) / 100 + "px";
        }

        if (h.shape === "circle") {
          d.classList.add("circle");
        }

        d.setAttribute("aria-label", getHotspotText(h));
        d.addEventListener("click", () => onHotspotClick(h, d));

        hotspotsLayer.appendChild(d);
      });

      if (currentLabelHotspot) {
        repositionCurrentLabel();
      }
    }

    function setMode(neu) {
      mode = neu;
      clearPendingLearnHotspotAction();

      clearTimeout(timer);
      timer = null;

      stopSpeech();
      updateModeButtons();
      hideLabel();
      hideSpecialImageLabel();

      feedback.textContent = "";
      feedback.className = "";

      if (isZoomOpen()) {
        activeZoomHotspot = null;
        clearZoomReveal();
        loadCurrentImage();
        return;
      }

      if (neu === "lernen") {
        quizAktiv = false;
        updateLernInfo();
        updateModePanels();
      } else {
        resetQuizQueues();
        nextQuestion();
        updateModePanels();
      }
    }

    function runLearnHotspotClick(h) {
      if (h.openFolderKey) {
        clearTimeout(timer);
        timer = null;

        showLabel(h);
        if (!currentImageMutesFolderHotspotSpeech()) {
          speakWord(h.wort);
        }

        timer = setTimeout(() => {
          openNestedFolder(h.openFolderKey, h);
        }, h.openDelay ?? 650);
        return;
      }

      if (currentImageDisablesWordsInLearnMode()) {
        stopSpeech();
        hideLabel();
        return;
      }

      if (h.zoomImage && !isZoomOpen()) {
        clearTimeout(timer);
        timer = null;

        showLabel(h);
        speakWord(h.wort);

        timer = setTimeout(() => {
          openZoomImage(h);
        }, 650);
        return;
      }

      showLabel(h);
      speakWord(h.wort);
    }

    function onHotspotClick(h, el) {
      if (mode === "lernen") {
        clearPendingLearnHotspotAction();
        pendingLearnHotspotTimer = setTimeout(() => {
          pendingLearnHotspotTimer = null;
          runLearnHotspotClick(h);
        }, HOTSPOT_DOUBLE_CLICK_DELAY_MS);
        return;
      }

      if (!quizAktiv) return;

      if (getHotspotQuizKey(h) === getHotspotQuizKey(currentQuestionHotspot)) {
        playCorrectSound();

        feedback.className = "";
        void feedback.offsetWidth;

        feedback.textContent = getUi("correct");
        feedback.className = "richtig feedback-anim";

        timer = setTimeout(nextQuestion, 650);
      } else {
        playWrongSound();

        feedback.className = "";
        void feedback.offsetWidth;

        feedback.textContent = getUi("wrong");
        feedback.className = "falsch feedback-anim";

        if (navigator.vibrate) {
          navigator.vibrate([120, 70, 170]);
        }

        scheduleRepeat(currentQuestionHotspot);

        el.classList.add("fehler");
        setTimeout(() => {
          el.classList.remove("fehler");
        }, 300);
      }
    }

    function showImageOpenLabelIfNeeded() {
      if (isZoomOpen()) return;

      const imageData = getCurrentImageData();

      if (!imageData.openLabel) return;

      showLabel(imageData.openLabel, { persistent: true });

      if (imageData.speakOpenLabel && !silentAfterDoubleClick) {
        speakWord(imageData.openLabel.wort);
      }
    }

    function updateSpecialImageLabel() {
      if (mode !== "lernen" || isZoomOpen()) {
        hideSpecialImageLabel();
        return;
      }

      const imageData = getCurrentImageData();

      if (!imageData.specialTopLabel) {
        hideSpecialImageLabel();
        return;
      }

      specialImageLabel.textContent = resolveLocalizedText(imageData.specialTopLabel);
      specialImageLabel.style.display = "block";
    }

    function hideSpecialImageLabel() {
      specialImageLabel.style.display = "none";
      specialImageLabel.textContent = "";
    }

    function positionLabelElement(el, hotspot) {
      let left = imagePercentToPixelX(hotspot.labelX);
      let top = imagePercentToPixelY(hotspot.labelY);

      el.style.left = left + "px";
      el.style.top = top + "px";
      el.style.display = "block";

      const halfWidth = el.offsetWidth / 2;
      const halfHeight = el.offsetHeight / 2;
      const minX = imageDisplay.x + halfWidth + 8;
      const maxX = imageDisplay.x + imageDisplay.w - halfWidth - 8;
      const minY = imageDisplay.y + halfHeight + 8;
      const maxY = imageDisplay.y + imageDisplay.h - halfHeight - 8;

      left = Math.max(minX, Math.min(maxX, left));
      top = Math.max(minY, Math.min(maxY, top));

      el.style.left = left + "px";
      el.style.top = top + "px";
    }

    function showLabel(hotspot, options = {}) {
      if (labelHideTimer) {
        clearTimeout(labelHideTimer);
        labelHideTimer = null;
      }

      hideSpecialImageLabel();

      currentLabelHotspot = hotspot;
      currentLabelIsPersistent = !!options.persistent;

      label.textContent = getHotspotText(hotspot);
      positionLabelElement(label, hotspot);

      label.classList.remove("show");
      void label.offsetWidth;
      label.classList.add("show");

      if (mode === "lernen" && !currentLabelIsPersistent) {
        labelHideTimer = setTimeout(() => {
          hideLabel();
        }, LABEL_AUTO_HIDE_MS);
      }
    }

    function repositionCurrentLabel() {
      if (!currentLabelHotspot) return;

      positionLabelElement(label, currentLabelHotspot);
    }

    function hideLabel() {
      if (labelHideTimer) {
        clearTimeout(labelHideTimer);
        labelHideTimer = null;
      }

      currentLabelHotspot = null;
      currentLabelIsPersistent = false;
      label.style.display = "none";
      label.classList.remove("show");
    }

    function openZoomImage(hotspot) {
      clearTimeout(timer);
      timer = null;

      stopSpeech();
      hideLabel();
      hideSpecialImageLabel();
      prepareZoomReveal(hotspot);
      bildContainer.classList.add("reveal-pending");

      activeZoomHotspot = hotspot;

      loadCurrentImage(() => {
        showLabel({
          wort: hotspot.wort,
          labelX: hotspot.zoomLabelX ?? 50,
          labelY: hotspot.zoomLabelY ?? 10
        }, { persistent: true });
      });
    }

    function closeZoomImage() {
      clearTimeout(timer);
      timer = null;

      stopSpeech();
      hideLabel();
      clearZoomReveal();

      activeZoomHotspot = null;
      loadCurrentImage();
    }

    function shuffleArray(arr) {
      const copy = [...arr];

      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }

      return copy;
    }

    function refillQuizQueue() {
      const alleHotspots = getUniqueQuizHotspots(getCurrentImageData());
      const rest = alleHotspots.filter(
        (hotspot) => !quizQueue.includes(hotspot) && !repeatQueue.includes(hotspot)
      );

      quizQueue.push(...shuffleArray(rest));
    }

    function markAsked(hotspot) {
      recentQuestions.push(hotspot);

      if (recentQuestions.length > MIN_REPEAT_DELAY) {
        recentQuestions.shift();
      }
    }

    function canRepeatNow(hotspot) {
      return !recentQuestions.includes(hotspot);
    }

    function scheduleRepeat(hotspot) {
      if (hotspot && !repeatQueue.includes(hotspot)) {
        repeatQueue.push(hotspot);
      }
    }

    function getNextRepeatWord() {
      for (let i = 0; i < repeatQueue.length; i++) {
        const hotspot = repeatQueue[i];

        if (canRepeatNow(hotspot)) {
          repeatQueue.splice(i, 1);
          return hotspot;
        }
      }

      return null;
    }

    function getNextNormalWord() {
      if (quizQueue.length === 0) {
        refillQuizQueue();
      }

      for (let i = 0; i < quizQueue.length; i++) {
        const hotspot = quizQueue[i];

        if (canRepeatNow(hotspot)) {
          quizQueue.splice(i, 1);
          return hotspot;
        }
      }

      return quizQueue.shift() || null;
    }

    function nextQuestion() {
      if (repeatQueue.length === 0 && quizQueue.length === 0) {
        refillQuizQueue();
      }

      let nextHotspot = getNextRepeatWord();

      if (!nextHotspot) {
        nextHotspot = getNextNormalWord();
      }

      if (!nextHotspot) {
        refillQuizQueue();
        nextHotspot = getNextNormalWord();
      }

      currentQuestionHotspot = nextHotspot;
      gesucht = getHotspotText(nextHotspot);
      markAsked(nextHotspot);

      frage.textContent = gesucht;
      feedback.textContent = "";
      feedback.className = "";

      hideLabel();
      hideSpecialImageLabel();
      quizAktiv = true;

      if (quizSpeechEnabled) {
        speakCurrentQuestion();
      }
    }

    function animateImageChange(direction, updateImageCallback) {
      if (isAnimating) return;

      isAnimating = true;

      const outClass = direction === "left" ? "slide-out-left" : "slide-out-right";
      const inClass = direction === "left" ? "slide-in-left" : "slide-in-right";

      bild.classList.remove("slide-out-left", "slide-out-right", "slide-in-left", "slide-in-right");

      void bild.offsetWidth;
      bild.classList.add(outClass);

      setTimeout(() => {
        bild.classList.remove(outClass);

        bild.onload = () => {
          setTimeout(() => {
            updateImageDisplay();
            buildHotspots();
            hideLabel();
            updateSpecialImageLabel();

            bild.classList.add(inClass);

            setTimeout(() => {
              bild.classList.remove(inClass);
              isAnimating = false;
            }, 220);

            if (mode === "lernen") {
              updateModePanels();
              updateLernInfo();
            } else {
              updateModePanels();
              resetQuizQueues();
              nextQuestion();
            }

            feedback.textContent = "";
            feedback.className = "";

            updateCurrentTitle();

            updateModeButtons();
            updateMuteButton();
            updateImageNavButtons();
          }, 60);
        };

        updateImageCallback();
      }, 220);
    }

    function showNextImage() {
      const total = folders[currentFolderKey].images.length;

      if (isAnimating || total < 2 || isZoomOpen()) return;

      clearTimeout(timer);
      timer = null;

      stopSpeech();

      animateImageChange("left", () => {
        currentImageIndex = (currentImageIndex + 1) % total;
        bild.src = buildFreshImageSrc(getCurrentImageData().file);
      });
    }

    function showPrevImage() {
      const total = folders[currentFolderKey].images.length;

      if (isAnimating || total < 2 || isZoomOpen()) return;

      clearTimeout(timer);
      timer = null;

      stopSpeech();

      animateImageChange("right", () => {
        currentImageIndex = (currentImageIndex - 1 + total) % total;
        bild.src = buildFreshImageSrc(getCurrentImageData().file);
      });
    }

    function handleSwipe() {
      const total = folders[currentFolderKey].images.length;

      if (isAnimating || total < 2 || isZoomOpen()) return;

      const diff = touchEndX - touchStartX;

      if (Math.abs(diff) < 50) return;

      if (diff < 0) {
        showNextImage();
      } else {
        showPrevImage();
      }
    }

    function isFullscreenActive() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    async function toggleFullscreen() {
      if (isFullscreenActive()) {
        await exitFullscreen();
      } else {
        await enterFullscreen();
      }
    }

    async function enterFullscreen() {
      try {
        const el = document.documentElement;

        if (!isFullscreenActive() && el.requestFullscreen) {
          await el.requestFullscreen({ navigationUI: "hide" });
        } else if (!isFullscreenActive() && el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
        }
      } catch (err) {
        console.log("Vollbild konnte nicht automatisch gestartet werden.");
      }
    }

    async function exitFullscreen() {
      try {
        if (document.fullscreenElement && document.exitFullscreen) {
          await document.exitFullscreen();
        } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      } catch (err) {
        console.log("Fullscreen konnte nicht beendet werden.");
      }
    }

    function updateFullscreenButtonText() {
      fullscreenBtn.textContent = isFullscreenActive() ? getUi("fullscreenOff") : getUi("fullscreen");
    }

    function stopSpeech() {
      speechRequestId += 1;

      if (speechSource) {
        try {
          speechSource.stop();
        } catch (err) {
          // Source kann bereits beendet sein.
        }
        speechSource.disconnect?.();
        speechSource = null;
      }

      if (speechAudio) {
        try {
          speechAudio.pause();
          speechAudio.currentTime = 0;
          speechAudio.src = "";
        } catch (err) {
          // Audio kann bereits freigegeben sein.
        }
        speechAudio = null;
      }

      if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
      }
    }

    function getSpeechLangCodeForEntry(entry) {
      const resolvedLanguage = resolveLocalizedEntry(entry).lang;
      return SPEECH_LANG_CODES[resolvedLanguage] ?? SPEECH_LANG_CODES.es;
    }

    async function tryPlayLocalTts(text, lang) {
      const requestId = ++speechRequestId;
      const audioUrl = `${LOCAL_TTS_ENDPOINT}?text=${encodeURIComponent(text)}&lang=${encodeURIComponent(lang)}`;

      if (IS_APPLE_TOUCH_DEVICE) {
        const ctx = ensureAudioContext();

        if (!ctx) {
          throw new Error("audio-context-unavailable");
        }

        const response = await fetch(audioUrl, { mode: "cors", cache: "default" });

        if (!response.ok) {
          throw new Error(`audio-fetch-failed-${response.status}`);
        }

        const audioBufferData = await response.arrayBuffer();

        if (requestId !== speechRequestId) return true;

        const decodedBuffer = await ctx.decodeAudioData(audioBufferData.slice(0));

        if (requestId !== speechRequestId) return true;

        const source = ctx.createBufferSource();
        source.buffer = decodedBuffer;
        source.connect(ctx.destination);
        source.onended = () => {
          if (speechSource === source) {
            speechSource = null;
          }
        };

        speechSource = source;
        source.start();
        return true;
      }

      const audio = new Audio(audioUrl);
      audio.preload = "auto";
      audio.playsInline = true;

      speechAudio = audio;

      await new Promise((resolve, reject) => {
        let loadTimeout = null;

        const cleanup = () => {
          if (loadTimeout) {
            clearTimeout(loadTimeout);
            loadTimeout = null;
          }
          audio.onloadeddata = null;
          audio.oncanplay = null;
          audio.onerror = null;
        };

        const resolveWhenReady = () => {
          cleanup();
          resolve();
        };

        audio.onloadeddata = resolveWhenReady;
        audio.oncanplay = resolveWhenReady;
        audio.onerror = () => {
          cleanup();
          reject(new Error("audio-load-failed"));
        };

        loadTimeout = setTimeout(() => {
          cleanup();
          reject(new Error("audio-load-timeout"));
        }, 2200);

        audio.load();
      });

      if (requestId !== speechRequestId) return true;

      await audio.play();
      return true;
    }

    function speakViaBrowserTts(utterance) {
      try {
        if (speechSynthesis.speaking || speechSynthesis.pending) {
          speechSynthesis.cancel();
        }
      } catch (err) {
        // Manche Browser reagieren hier empfindlich; dann einfach direkt sprechen.
      }

      speechSynthesis.speak(utterance);
    }

    function speakWord(entryOrText) {
      if (isMuted) return;
      const resolvedEntry = resolveLocalizedEntry(entryOrText);

      if (!resolvedEntry.text) {
        console.log("TTS: kein Text aufgelöst");
        return;
      }

      if (!("speechSynthesis" in window)) {
        console.log("TTS: speechSynthesis nicht verfügbar");
        return;
      }

      const utterance = new SpeechSynthesisUtterance(resolvedEntry.text.replace(/\n/g, " "));

      utterance.lang = getSpeechLangCodeForEntry(entryOrText);
      utterance.rate = 0.9;
      utterance.pitch = 1.0;
      utterance.volume = 1.0;
      utterance.onstart = () => console.log(`TTS start: ${utterance.lang} :: ${resolvedEntry.text}`);
      utterance.onend = () => console.log(`TTS end: ${resolvedEntry.text}`);
      utterance.onerror = (event) => console.log(`TTS error: ${event.error || "unbekannt"}`);

      console.log(`TTS speak angefragt: ${utterance.lang} :: ${resolvedEntry.text}`);

      tryPlayLocalTts(resolvedEntry.text, utterance.lang)
        .then(() => {
          console.log(`TTS lokal abgespielt: ${utterance.lang} :: ${resolvedEntry.text}`);
        })
        .catch(() => {
          console.log(`TTS lokal nicht verfügbar, Fallback auf Browser: ${utterance.lang} :: ${resolvedEntry.text}`);
          speakViaBrowserTts(utterance);
        });
    }

    function speakCurrentQuestion() {
      if (currentQuestionHotspot) {
        speakWord(currentQuestionHotspot.wort);
      } else {
        speakWord(gesucht);
      }
    }

    function toggleQuizSpeech() {
      quizSpeechEnabled = !quizSpeechEnabled;

      if (!quizSpeechEnabled) {
        stopSpeech();
      } else if (mode === "quiz" && quizAktiv) {
        speakCurrentQuestion();
      }

      updateSpeakButton();
    }

    function ensureAudioContext() {
      if (isMuted) return null;

      const AudioContextClass = window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) return null;

      if (!audioCtx) {
        audioCtx = new AudioContextClass();
      }

      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }

      return audioCtx;
    }

    function playTone(frequency, duration, type = "sine", volume = 0.08, startDelay = 0) {
      const ctx = ensureAudioContext();

      if (!ctx) return;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(frequency, ctx.currentTime + startDelay);

      gain.gain.setValueAtTime(0.0001, ctx.currentTime + startDelay);
      gain.gain.exponentialRampToValueAtTime(volume, ctx.currentTime + startDelay + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + startDelay + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(ctx.currentTime + startDelay);
      osc.stop(ctx.currentTime + startDelay + duration + 0.02);
    }

    function playCorrectSound() {
      playTone(740, 0.12, "sine", 0.08, 0);
      playTone(988, 0.16, "sine", 0.07, 0.08);
    }

    function playWrongSound() {
      playTone(260, 0.14, "square", 0.07, 0);
      playTone(180, 0.22, "square", 0.06, 0.10);
    }

    window.addEventListener("resize", refreshDisplayedLayout);

    applyLanguage();
    updateImageNavButtons();
  </script>
</body>

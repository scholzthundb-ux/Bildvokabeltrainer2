
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vokabeltrainer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      background: #f0f4f8;
      padding: 0 10px 30px;
    }

    h1 {
      margin: 20px 0 10px;
      font-size: 28px;
    }

    #menu {
      padding: 20px 0;
    }

    .menu-btn, #back, #nextBtn, .mode-btn {
      padding: 12px 18px;
      margin: 8px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      background: #0d6efd;
      color: white;
      cursor: pointer;
    }

    .mode-btn.active {
      background: #084298;
    }

    .bild {
      position: relative;
      max-width: 900px;
      margin: 0 auto;
    }

    #bild {
      width: 100%;
      display: block;
    }

    #hotspots {
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    .hotspot {
      position: absolute;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 11;
    }

    #app {
      display: none;
    }

    #steuerleiste {
      margin: 10px auto 18px;
      max-width: 900px;
      background: white;
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    #modusButtons {
      margin-bottom: 10px;
    }

    #quizBox {
      display: none;
    }

    #frage {
      font-size: clamp(22px, 5vw, 34px);
      font-weight: bold;
      margin-bottom: 10px;
    }

    #feedback {
      min-height: 38px;
      font-size: clamp(20px, 4.5vw, 30px);
      font-weight: bold;
      margin-bottom: 8px;
    }

    .richtig {
      color: #157347;
    }

    .falsch {
      color: #b02a37;
    }

    #loesung {
      min-height: 32px;
      font-size: clamp(18px, 4vw, 26px);
      margin-bottom: 8px;
    }

    #score {
      font-size: 18px;
      margin-top: 4px;
    }

    #lernInfo {
      display: none;
      font-size: clamp(20px, 4vw, 28px);
      font-weight: bold;
    }

    #label {
      position: absolute;
      display: none;
      background: white;
      border: 3px solid black;
      border-radius: 14px;
      padding: 14px 20px;
      font-size: clamp(24px, 6vw, 40px);
      font-weight: bold;
      transform: translate(-50%, -50%);
      z-index: 20;
      white-space: nowrap;
      box-shadow: 0 6px 14px rgba(0,0,0,0.4);
    }
  </style>
</head>

<body>

<h1>Vokabeltrainer</h1>

<div id="menu">
  <button class="menu-btn" onclick="ladeThema('strand')">Strand</button>
</div>

<div id="app">
  <button id="back" onclick="zurueck()">← Zurück</button>

  <div id="steuerleiste">
    <div id="modusButtons">
      <button id="lernBtn" class="mode-btn active" onclick="setModus('lernen')">Lernmodus</button>
      <button id="quizBtn" class="mode-btn" onclick="setModus('quiz')">Quizmodus</button>
    </div>

    <div id="lernInfo">
      Tippe auf ein Objekt.
    </div>

    <div id="quizBox">
      <div id="frage">Finde: ...</div>
      <div id="feedback"></div>
      <div id="loesung"></div>
      <button id="nextBtn" onclick="naechsteFrage()">Nächster Begriff</button>
      <div id="score">0 richtig | 0 falsch</div>
    </div>
  </div>

  <div class="bild">
    <img id="bild" src="">
    <div id="hotspots"></div>
    <div id="label"></div>
  </div>
</div>

<script>
const themen = {
  strand: {
    image: "strand-ohne-woerter.png",
    hotspots: [
      { wort:"el sol", x:74, y:26, left:68, top:26, width:10, height:10 },
      { wort:"la palmera", x:22, y:31, left:9, top:36, width:9, height:10 },
      { wort:"el mar", x:42, y:44, left:33, top:44, width:8, height:9 },
      { wort:"el barco", x:56, y:48, left:48, top:42, width:8, height:9 },
      { wort:"la ola", x:72, y:58, left:69, top:56, width:7, height:8 },
      { wort:"la tabla de surf", x:61, y:63, left:45, top:60, width:8, height:10 },
      { wort:"el bañador", x:56, y:68, left:37, top:71, width:9, height:9 },
      { wort:"la sombrilla", x:12, y:69, left:8, top:61, width:8, height:10 },
      { wort:"la toalla", x:18, y:90, left:8, top:86, width:8, height:9 },
      { wort:"las gafas de sol", x:41, y:92, left:34, top:87, width:8, height:8 },
      { wort:"la crema solar", x:66, y:89, left:55, top:85, width:8, height:8 },
      { wort:"la concha", x:86, y:90, left:90, top:87, width:7, height:8 },
      { wort:"el chiringuito", x:84, y:66, left:87, top:60, width:7, height:9 }
    ]
  }
};

let aktuellesThema = null;
let aktuellerModus = "lernen";
let gesuchteVokabel = "";
let quizAktiv = false;
let richtig = 0;
let falsch = 0;

function ladeThema(name) {
  const t = themen[name];
  aktuellesThema = t;

  document.getElementById("menu").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("bild").src = t.image;

  const h = document.getElementById("hotspots");
  h.innerHTML = "";

  t.hotspots.forEach(e => {
    const b = document.createElement("button");
    b.className = "hotspot";
    b.style.left = e.left + "%";
    b.style.top = e.top + "%";
    b.style.width = e.width + "%";
    b.style.height = e.height + "%";
    b.onclick = () => hotspotGeklickt(e);
    h.appendChild(b);
  });

  richtig = 0;
  falsch = 0;
  scoreAktualisieren();
  setModus("lernen");
}

function setModus(modus) {
  aktuellerModus = modus;

  document.getElementById("lernBtn").classList.toggle("active", modus === "lernen");
  document.getElementById("quizBtn").classList.toggle("active", modus === "quiz");

  document.getElementById("label").style.display = "none";
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "";
  document.getElementById("loesung").textContent = "";

  if (modus === "lernen") {
    document.getElementById("lernInfo").style.display = "block";
    document.getElementById("quizBox").style.display = "none";
    quizAktiv = false;
  } else {
    document.getElementById("lernInfo").style.display = "none";
    document.getElementById("quizBox").style.display = "block";
    naechsteFrage();
  }
}

function hotspotGeklickt(e) {
  if (aktuellerModus === "lernen") {
    const l = document.getElementById("label");
    l.textContent = e.wort;
    l.style.left = e.x + "%";
    l.style.top = e.y + "%";
    l.style.display = "block";
    return;
  }

  if (aktuellerModus === "quiz") {
    if (!quizAktiv) return;

    const feedback = document.getElementById("feedback");
    const loesung = document.getElementById("loesung");

    if (e.wort === gesuchteVokabel) {
      feedback.textContent = "Richtig";
      feedback.className = "richtig";
      loesung.textContent = "";
      richtig++;
      quizAktiv = false;
    } else {
      feedback.textContent = "Falsch";
      feedback.className = "falsch";
      loesung.textContent = "Das war: " + e.wort;
      falsch++;
    }

    scoreAktualisieren();
  }
}

function zufallsBegriff() {
  const liste = aktuellesThema.hotspots;
  const index = Math.floor(Math.random() * liste.length);
  return liste[index].wort;
}

function naechsteFrage() {
  gesuchteVokabel = zufallsBegriff();
  quizAktiv = true;

  document.getElementById("frage").textContent = "Finde: " + gesuchteVokabel;
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "";
  document.getElementById("loesung").textContent = "";
  document.getElementById("label").style.display = "none";
}

function scoreAktualisieren() {
  document.getElementById("score").textContent =
    richtig + " richtig | " + falsch + " falsch";
}

function zurueck() {
  document.getElementById("app").style.display = "none";
  document.getElementById("menu").style.display = "block";
  document.getElementById("label").style.display = "none";
  document.getElementById("frage").textContent = "Finde: ...";
  document.getElementById("feedback").textContent = "";
  document.getElementById("loesung").textContent = "";
}
</script>

</body>
</html>

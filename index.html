
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vokabeltrainer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      background: #eef3f8;
      color: #1f2a37;
    }

    h1, h2, h3 {
      margin: 0;
    }

    .ui-btn {
      padding: 24px 36px;
      margin: 10px;
      border-radius: 22px;
      border: none;
      background: #2d7df6;
      color: white;
      font-size: 30px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    }

    .ui-btn:active {
      transform: scale(0.98);
    }

    .ui-btn.secondary {
      background: #5b6b7f;
    }

    .ui-btn.small {
      font-size: 18px;
      padding: 12px 18px;
      margin: 6px;
    }

    #menu,
    #folderMenu {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    #folderMenu,
    #app {
      display: none;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 700px;
      border-radius: 26px;
      padding: 40px 28px 36px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.12);
    }

    .start-icon {
      font-size: 64px;
      margin-bottom: 18px;
    }

    .subtitle {
      font-size: 24px;
      margin-top: 14px;
      margin-bottom: 30px;
      color: #4b5563;
      line-height: 1.4;
    }

    .folder-title {
      font-size: 42px;
      margin-bottom: 18px;
      font-weight: bold;
    }

    .folder-subtitle {
      font-size: 24px;
      color: #4b5563;
      margin-bottom: 28px;
    }

    .app-wrap {
      padding: 0 0 12px;
    }

    .current-title {
      display: none;
    }

    .mode-switch {
      display: flex;
      width: min(96vw, 760px);
      margin: 8px auto 4px;
      background: #dbe7f7;
      border-radius: 24px;
      padding: 6px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.08);
    }

    .mode-segment {
      flex: 1;
      border: none;
      background: transparent;
      color: #234;
      font-size: 30px;
      font-weight: bold;
      padding: 22px 10px;
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .mode-segment.active {
      background: #0b57d0;
      color: white;
      box-shadow: 0 6px 14px rgba(0,0,0,0.18);
    }

    .mode-segment:active {
      transform: scale(0.98);
    }

    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: min(96vw, 760px);
      margin: 0 auto 2px;
      padding: 0 6px;
      box-sizing: border-box;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-arrow {
      background: rgba(0,0,0,0.12);
      color: #1f2a37;
      border: none;
      font-size: 34px;
      font-weight: 900;
      line-height: 1;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-text-stroke: 1px currentColor;
    }

    .back-arrow:active {
      transform: scale(0.9);
    }

    .fullscreen-btn {
      background: #0b57d0;
      color: white;
      border: none;
      font-size: 16px;
      font-weight: bold;
      padding: 10px 16px;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.18);
    }

    .fullscreen-btn:active {
      transform: scale(0.97);
    }

    .swipe-info {
      font-size: 16px;
      color: #4b5563;
      margin: 4px 0 6px;
    }

    #quizBox {
      display: none;
      margin: 0;
      padding: 0;
    }

    .quiz-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 2px 8px 0;
    }

    #frage {
      font-size: 30px;
      margin: 0;
      font-weight: bold;
      line-height: 1.2;
    }

    .sound-btn {
      border: none;
      background: #0b57d0;
      color: white;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .sound-btn:active {
      transform: scale(0.95);
    }

    #feedback {
      font-size: 34px;
      font-weight: bold;
      min-height: 42px;
      margin: 0;
      line-height: 1.2;
    }

    .bild {
      position: relative;
      width: 100vw;
      max-width: 100vw;
      margin: 0 auto;
      touch-action: pan-y;
      overflow: hidden;
    }

    #bild {
      width: 100%;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    #hotspots {
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    .hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 11;
      background: transparent;
      border: none;
      cursor: pointer;
      width: 8%;
      height: 8%;
    }

    .hotspot.fehler {
      background: rgba(255, 0, 0, 0.28);
      border: 2px solid red;
      border-radius: 10px;
    }

    #label {
      position: absolute;
      background: linear-gradient(180deg, #ffffff 0%, #f7f7f7 100%);
      border: 3px solid #111;
      border-radius: 20px;
      padding: 12px 20px;
      font-size: clamp(26px, 5vw, 38px);
      font-weight: 700;
      color: #111;
      line-height: 1.1;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 20;
      white-space: nowrap;
      box-shadow: 0 10px 22px rgba(0,0,0,0.24);
      pointer-events: none;
    }

    @keyframes bubbleIn {
      0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    #label.show {
      animation: bubbleIn 0.18s ease-out;
    }

    #lernInfo {
      font-size: 18px;
      font-weight: bold;
      margin: 4px 8px 2px;
    }

    .richtig {
      color: green;
      font-weight: bold;
      font-size: 34px;
    }

    .falsch {
      color: red;
      font-weight: bold;
      font-size: 34px;
    }

    @keyframes pop {
      0%   { transform: scale(0.6); opacity: 0; }
      60%  { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); }
    }

    .feedback-anim {
      animation: pop 0.35s ease;
    }

    #bild.slide-out-left {
      animation: slideOutLeft 0.22s ease forwards;
    }

    #bild.slide-out-right {
      animation: slideOutRight 0.22s ease forwards;
    }

    #bild.slide-in-left {
      animation: slideInLeft 0.22s ease forwards;
    }

    #bild.slide-in-right {
      animation: slideInRight 0.22s ease forwards;
    }

    @keyframes slideOutLeft {
      0% {
        transform: translateX(0);
        opacity: 1;
      }
      100% {
        transform: translateX(-28px);
        opacity: 0.35;
      }
    }

    @keyframes slideOutRight {
      0% {
        transform: translateX(0);
        opacity: 1;
      }
      100% {
        transform: translateX(28px);
        opacity: 0.35;
      }
    }

    @keyframes slideInLeft {
      0% {
        transform: translateX(28px);
        opacity: 0.35;
      }
      100% {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes slideInRight {
      0% {
        transform: translateX(-28px);
        opacity: 0.35;
      }
      100% {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @media (max-width: 600px) {
      .mode-segment {
        font-size: 24px;
        padding: 18px 8px;
      }

      .fullscreen-btn {
        font-size: 14px;
        padding: 9px 12px;
      }

      .back-arrow {
        width: 56px;
        height: 56px;
        font-size: 36px;
      }

      #frage {
        font-size: 26px;
      }

      #feedback,
      .richtig,
      .falsch {
        font-size: 30px;
      }

      .sound-btn {
        width: 42px;
        height: 42px;
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <div id="menu">
    <div class="card">
      <div class="start-icon">🧠</div>
      <h1>Vokabeltrainer</h1>
      <div class="subtitle">
        Lerne spanische Wörter direkt am Bild.
      </div>
      <button class="ui-btn" id="openStrandBtn">Strand</button>
    </div>
  </div>

  <div id="folderMenu">
    <div class="card">
      <div class="folder-title">Strand</div>
      <div class="folder-subtitle">Wähle ein Bild zum Lernen.</div>

      <div>
        <button class="ui-btn image-btn" data-index="0">Bild 1</button>
        <button class="ui-btn image-btn" data-index="1">Bild 2</button>
      </div>

      <div style="margin-top:18px;">
        <button class="ui-btn secondary small" id="backToStartBtn">← Zurück</button>
      </div>
    </div>
  </div>

  <div id="app" class="app-wrap">
    <div class="current-title" id="currentImageTitle">Strand – Bild 1</div>

    <div class="mode-switch">
      <button class="mode-segment active" id="lernBtn">Lernen</button>
      <button class="mode-segment" id="quizBtn">Quiz</button>
    </div>

    <div class="nav-row">
      <div class="nav-left">
        <button class="back-arrow" id="backToFolderBtn">←</button>
      </div>
      <button class="fullscreen-btn" id="fullscreenBtn">Vollbild</button>
    </div>

    <div id="lernInfo">Tippe auf eine Pfeilspitze.</div>

    <div id="quizBox">
      <div class="quiz-top">
        <div id="frage"></div>
        <button id="speakBtn" class="sound-btn" type="button" aria-label="Wort anhören">🔊</button>
      </div>
      <div id="feedback"></div>
    </div>

    <div id="swipeInfo" class="swipe-info">Zum Bildwechsel nach links oder rechts wischen.</div>

    <div class="bild">
      <img id="bild" src="" alt="Strandbild">
      <div id="hotspots"></div>
      <div id="label"></div>
    </div>
  </div>

  <script>
    const folders = {
      strand: {
        title: "Strand",
        images: [
          {
            title: "Strand – Bild 1",
            file: "strand-ohne-woerter.png",
            hotspots: [
              { wort:"el sol", clickX:70, clickY:26, labelX:74, labelY:22, boost:1 },
              { wort:"la palmera", clickX:14, clickY:41, labelX:22, labelY:31, boost:1 },
              { wort:"el mar", clickX:41, clickY:48, labelX:42, labelY:44, boost:1 },
              { wort:"el barco", clickX:50, clickY:44, labelX:56, labelY:48, boost:1 },
              { wort:"la ola", clickX:73, clickY:58, labelX:72, labelY:58, boost:1 },
              { wort:"la tabla de surf", clickX:47, clickY:59, labelX:61, labelY:63, boost:1 },
              { wort:"el bañador", clickX:38, clickY:71, labelX:56, labelY:68, boost:1 },
              { wort:"la sombrilla", clickX:13, clickY:66, labelX:12, labelY:69, boost:1 },
              { wort:"la toalla", clickX:12, clickY:86, labelX:18, labelY:90, boost:1 },
              { wort:"las gafas de sol", clickX:36, clickY:90, labelX:41, labelY:92, boost:1 },
              { wort:"la crema solar", clickX:60, clickY:87, labelX:66, labelY:89, boost:1 },
              { wort:"la concha", clickX:90, clickY:90, labelX:86, labelY:90, boost:1 },
              { wort:"el chiringuito", clickX:90, clickY:53, labelX:79, labelY:66, boost:1 }
            ]
          },
          {
            title: "Strand – Bild 2",
            file: "strand2.png?v=2",
            hotspots: [
              { wort:"el sol", clickX:28, clickY:18, labelX:33, labelY:15, boost:1 },
              { wort:"la gaviota", clickX:69, clickY:18, labelX:67, labelY:13, boost:1 },
              { wort:"el socorrista", clickX:72, clickY:43, labelX:80, labelY:35, boost:1 },
              { wort:"el salvavidas", clickX:56, clickY:57, labelX:51, labelY:52, boost:1 },
              { wort:"la sombrilla", clickX:18, clickY:50, labelX:27, labelY:47, boost:1 },
              { wort:"la tumbona", clickX:18, clickY:75, labelX:26, labelY:72, boost:1 },
              { wort:"el sombrero de sol", clickX:31, clickY:78, labelX:36, labelY:73, boost:1 },
              { wort:"el castillo de arena", clickX:49, clickY:86, labelX:57, labelY:81, boost:1 },
              { wort:"la niña", clickX:84, clickY:74, labelX:88, labelY:69, boost:1 },
              { wort:"la pala", clickX:61, clickY:94, labelX:65, labelY:90, boost:1 },
              { wort:"la pelota", clickX:77, clickY:93, labelX:83, labelY:89, boost:1 },
              { wort:"el flotador", clickX:89, clickY:60, labelX:82, labelY:55, boost:1 }
            ]
          }
        ]
      }
    };

    let currentFolderKey = "strand";
    let currentImageIndex = 0;
    let mode = "lernen";
    let gesucht = "";
    let letztesGesucht = "";
    let quizAktiv = false;
    let timer = null;
    let touchStartX = 0;
    let touchEndX = 0;
    let isAnimating = false;
    let speechReady = false;
    let audioCtx = null;

    const menu = document.getElementById("menu");
    const folderMenu = document.getElementById("folderMenu");
    const app = document.getElementById("app");
    const hotspotsLayer = document.getElementById("hotspots");
    const label = document.getElementById("label");
    const frage = document.getElementById("frage");
    const feedback = document.getElementById("feedback");
    const quizBox = document.getElementById("quizBox");
    const lernInfo = document.getElementById("lernInfo");
    const swipeInfo = document.getElementById("swipeInfo");
    const lernBtn = document.getElementById("lernBtn");
    const quizBtn = document.getElementById("quizBtn");
    const bild = document.getElementById("bild");
    const currentImageTitle = document.getElementById("currentImageTitle");
    const bildContainer = document.querySelector(".bild");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const speakBtn = document.getElementById("speakBtn");

    document.getElementById("openStrandBtn").addEventListener("click", openFolderMenu);
    document.getElementById("backToStartBtn").addEventListener("click", backToStart);
    document.getElementById("backToFolderBtn").addEventListener("click", backToFolderMenu);

    lernBtn.addEventListener("click", () => setMode("lernen"));
    quizBtn.addEventListener("click", () => setMode("quiz"));
    fullscreenBtn.addEventListener("click", enterFullscreen);
    speakBtn.addEventListener("click", () => speakWord(gesucht));

    document.querySelectorAll("#folderMenu .image-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        openImage(Number(btn.dataset.index));
      });
    });

    bildContainer.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    });

    bildContainer.addEventListener("touchend", (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    });

    document.addEventListener("fullscreenchange", updateFullscreenButtonText);

    if ("speechSynthesis" in window) {
      speechSynthesis.onvoiceschanged = () => {
        speechReady = true;
      };
      speechReady = true;
    }

    function getCurrentImageData() {
      return folders[currentFolderKey].images[currentImageIndex];
    }

    function openFolderMenu() {
      menu.style.display = "none";
      folderMenu.style.display = "flex";
      app.style.display = "none";
    }

    function backToStart() {
      folderMenu.style.display = "none";
      app.style.display = "none";
      menu.style.display = "flex";
    }

    async function backToFolderMenu() {
      app.style.display = "none";
      folderMenu.style.display = "flex";
      clearTimeout(timer);
      timer = null;
      label.style.display = "none";
      feedback.textContent = "";
      feedback.className = "";
      stopSpeech();
      await exitFullscreen();
    }

    async function openImage(index) {
      currentImageIndex = index;
      folderMenu.style.display = "none";
      menu.style.display = "none";
      app.style.display = "block";
      mode = "lernen";
      quizAktiv = false;
      clearTimeout(timer);
      timer = null;
      updateModeButtons();
      loadCurrentImage();

      setTimeout(async () => {
        await enterFullscreen();
      }, 120);
    }

    function updateModeButtons() {
      lernBtn.classList.toggle("active", mode === "lernen");
      quizBtn.classList.toggle("active", mode === "quiz");
    }

    function loadCurrentImage() {
      const imageData = getCurrentImageData();
      bild.src = imageData.file;
      currentImageTitle.textContent = imageData.title;

      buildHotspots();
      label.style.display = "none";
      feedback.textContent = "";
      feedback.className = "";

      if (mode === "lernen") {
        quizBox.style.display = "none";
        lernInfo.style.display = "block";
        swipeInfo.style.display = "block";
      } else {
        quizBox.style.display = "block";
        lernInfo.style.display = "none";
        swipeInfo.style.display = "none";
        nextQuestion();
      }

      updateModeButtons();
    }

    function buildHotspots() {
      hotspotsLayer.innerHTML = "";

      const hotspots = getCurrentImageData().hotspots;

      hotspots.forEach(h => {
        const d = document.createElement("div");
        d.className = "hotspot";
        d.style.left = h.clickX + "%";
        d.style.top = h.clickY + "%";
        d.addEventListener("click", () => onHotspotClick(h, d));
        hotspotsLayer.appendChild(d);
      });
    }

    function setMode(neu) {
      mode = neu;
      clearTimeout(timer);
      timer = null;
      stopSpeech();

      updateModeButtons();
      label.style.display = "none";
      feedback.textContent = "";
      feedback.className = "";

      if (neu === "lernen") {
        quizBox.style.display = "none";
        lernInfo.style.display = "block";
        swipeInfo.style.display = "block";
        quizAktiv = false;
      } else {
        quizBox.style.display = "block";
        lernInfo.style.display = "none";
        swipeInfo.style.display = "none";
        nextQuestion();
      }
    }

    function onHotspotClick(h, el) {
      if (mode === "lernen") {
        showLabel(h.wort, h.labelX, h.labelY);
        speakWord(h.wort);
        return;
      }

      if (!quizAktiv) return;

      if (h.wort === gesucht) {
        playCorrectSound();
        feedback.textContent = "👍 Richtig";
        feedback.className = "richtig feedback-anim";
        void feedback.offsetWidth;

        h.boost = Math.max(1, h.boost - 1);
        timer = setTimeout(nextQuestion, 650);
      } else {
        playWrongSound();
        feedback.textContent = "👎 Falsch";
        feedback.className = "falsch feedback-anim";
        void feedback.offsetWidth;

        if (navigator.vibrate) {
          navigator.vibrate([120, 70, 170]);
        }

        const ziel = getCurrentImageData().hotspots.find(x => x.wort === gesucht);
        if (ziel) {
          ziel.boost = Math.min(8, ziel.boost + 2);
        }

        el.classList.add("fehler");
        setTimeout(() => el.classList.remove("fehler"), 300);
      }
    }

    function showLabel(text, x, y) {
      label.textContent = text;
      label.style.left = x + "%";
      label.style.top = y + "%";
      label.style.display = "block";
      label.classList.remove("show");
      void label.offsetWidth;
      label.classList.add("show");
    }

    function getWeightedNextWord() {
      const hotspots = getCurrentImageData().hotspots;
      const kandidaten = hotspots.filter(h => h.wort !== letztesGesucht);
      const pool = kandidaten.length > 0 ? kandidaten : hotspots;

      let gesamt = 0;
      for (const h of pool) {
        gesamt += h.boost;
      }

      let zufall = Math.random() * gesamt;

      for (const h of pool) {
        zufall -= h.boost;
        if (zufall <= 0) {
          return h.wort;
        }
      }

      return pool[pool.length - 1].wort;
    }

    function nextQuestion() {
      gesucht = getWeightedNextWord();
      letztesGesucht = gesucht;

      frage.textContent = gesucht;
      feedback.textContent = "";
      feedback.className = "";
      label.style.display = "none";
      quizAktiv = true;
    }

    function animateImageChange(direction, updateImageCallback) {
      if (isAnimating) return;
      isAnimating = true;

      const outClass = direction === "left" ? "slide-out-left" : "slide-out-right";
      const inClass = direction === "left" ? "slide-in-left" : "slide-in-right";

      bild.classList.remove("slide-out-left", "slide-out-right", "slide-in-left", "slide-in-right");
      void bild.offsetWidth;

      bild.classList.add(outClass);

      setTimeout(() => {
        bild.classList.remove(outClass);

        updateImageCallback();
        buildHotspots();
        label.style.display = "none";

        bild.classList.add(inClass);

        setTimeout(() => {
          bild.classList.remove(inClass);
          isAnimating = false;
        }, 220);
      }, 220);
    }

    function showNextImage() {
      if (isAnimating) return;

      clearTimeout(timer);
      timer = null;
      stopSpeech();

      animateImageChange("left", () => {
        const total = folders[currentFolderKey].images.length;
        currentImageIndex = (currentImageIndex + 1) % total;

        const imageData = getCurrentImageData();
        bild.src = imageData.file;
        currentImageTitle.textContent = imageData.title;

        feedback.textContent = "";
        feedback.className = "";

        if (mode === "lernen") {
          quizBox.style.display = "none";
          lernInfo.style.display = "block";
          swipeInfo.style.display = "block";
        } else {
          quizBox.style.display = "block";
          lernInfo.style.display = "none";
          swipeInfo.style.display = "none";
          nextQuestion();
        }

        updateModeButtons();
      });
    }

    function showPrevImage() {
      if (isAnimating) return;

      clearTimeout(timer);
      timer = null;
      stopSpeech();

      animateImageChange("right", () => {
        const total = folders[currentFolderKey].images.length;
        currentImageIndex = (currentImageIndex - 1 + total) % total;

        const imageData = getCurrentImageData();
        bild.src = imageData.file;
        currentImageTitle.textContent = imageData.title;

        feedback.textContent = "";
        feedback.className = "";

        if (mode === "lernen") {
          quizBox.style.display = "none";
          lernInfo.style.display = "block";
          swipeInfo.style.display = "block";
        } else {
          quizBox.style.display = "block";
          lernInfo.style.display = "none";
          swipeInfo.style.display = "none";
          nextQuestion();
        }

        updateModeButtons();
      });
    }

    function handleSwipe() {
      if (isAnimating) return;

      const diff = touchEndX - touchStartX;

      if (Math.abs(diff) < 50) return;

      if (diff < 0) {
        showNextImage();
      } else {
        showPrevImage();
      }
    }

    async function enterFullscreen() {
      try {
        const el = document.documentElement;

        if (!document.fullscreenElement) {
          if (el.requestFullscreen) {
            await el.requestFullscreen({ navigationUI: "hide" });
          }
        }
      } catch (err) {
        console.log("Vollbild konnte nicht automatisch gestartet werden.");
      }
    }

    async function exitFullscreen() {
      try {
        if (document.fullscreenElement && document.exitFullscreen) {
          await document.exitFullscreen();
        }
      } catch (err) {
        console.log("Fullscreen konnte nicht beendet werden.");
      }
    }

    function updateFullscreenButtonText() {
      fullscreenBtn.textContent = document.fullscreenElement ? "Vollbild an" : "Vollbild";
    }

    function stopSpeech() {
      if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
      }
    }

    function getSpanishVoice() {
      if (!("speechSynthesis" in window)) return null;

      const voices = speechSynthesis.getVoices();
      if (!voices || !voices.length) return null;

      return (
        voices.find(v => v.lang && v.lang.toLowerCase().startsWith("es-es")) ||
        voices.find(v => v.lang && v.lang.toLowerCase().startsWith("es")) ||
        null
      );
    }

    function speakWord(text) {
      if (!text || !("speechSynthesis" in window)) return;

      stopSpeech();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "es-ES";
      utterance.rate = 0.9;
      utterance.pitch = 1.0;
      utterance.volume = 1.0;

      const voice = getSpanishVoice();
      if (voice) {
        utterance.voice = voice;
      }

      speechSynthesis.speak(utterance);
    }

    function ensureAudioContext() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;

      if (!audioCtx) {
        audioCtx = new AudioContextClass();
      }

      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }

      return audioCtx;
    }

    function playTone(frequency, duration, type = "sine", volume = 0.08, startDelay = 0) {
      const ctx = ensureAudioContext();
      if (!ctx) return;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(frequency, ctx.currentTime + startDelay);

      gain.gain.setValueAtTime(0.0001, ctx.currentTime + startDelay);
      gain.gain.exponentialRampToValueAtTime(volume, ctx.currentTime + startDelay + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + startDelay + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(ctx.currentTime + startDelay);
      osc.stop(ctx.currentTime + startDelay + duration + 0.02);
    }

    function playCorrectSound() {
      playTone(740, 0.12, "sine", 0.08, 0);
      playTone(988, 0.16, "sine", 0.07, 0.08);
    }

    function playWrongSound() {
      playTone(260, 0.14, "square", 0.07, 0);
      playTone(180, 0.22, "square", 0.06, 0.10);
    }
  </script>

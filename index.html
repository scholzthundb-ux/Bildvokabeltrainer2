<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vokabeltrainer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      background: #eef3f8;
      color: #1f2a37;
    }

    h1 {
      margin: 0;
      font-size: 40px;
      font-weight: bold;
    }

    .ui-btn {
      padding: 14px 22px;
      margin: 6px;
      border-radius: 14px;
      border: none;
      background: #2d7df6;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .ui-btn:active {
      transform: scale(0.98);
    }

    .mode-btn.active {
      background: #0b57d0;
    }

    #menu {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .start-card {
      background: white;
      width: 100%;
      max-width: 560px;
      border-radius: 26px;
      padding: 34px 24px 32px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.12);
    }

    .start-icon {
      font-size: 54px;
      margin-bottom: 14px;
    }

    .start-subtitle {
      font-size: 20px;
      margin-top: 12px;
      margin-bottom: 26px;
      color: #4b5563;
      line-height: 1.4;
    }

    .themenbox .ui-btn {
      font-size: 28px;
      padding: 20px 36px;
      border-radius: 18px;
      min-width: 220px;
    }

    #app {
      display: none;
      padding-bottom: 30px;
    }

    .topbar {
      padding-top: 16px;
    }

    .bild {
      position: relative;
      max-width: 900px;
      margin: auto;
    }

    #bild {
      width: 100%;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    #hotspots {
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    .hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 11;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .hotspot.fehler {
      background: rgba(255, 0, 0, 0.28);
      border: 2px solid red;
      border-radius: 10px;
    }

    #label {
      position: absolute;
      background: white;
      border: 3px solid black;
      border-radius: 14px;
      padding: 14px 20px;
      font-size: clamp(24px, 6vw, 40px);
      font-weight: bold;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 20;
      white-space: nowrap;
      box-shadow: 0 6px 14px rgba(0,0,0,0.4);
      pointer-events: none;
    }

    #quizBox {
      display: none;
    }

    #frage {
      font-size: 30px;
      margin: 10px;
      font-weight: bold;
    }

    #feedback {
      font-size: 28px;
      font-weight: bold;
      min-height: 36px;
    }

    .richtig { color: green; }
    .falsch { color: red; }

    #lernInfo {
      font-size: 22px;
      font-weight: bold;
      margin: 12px;
    }
  </style>
</head>
<body>

<div id="menu">
  <div class="start-card">
    <div class="start-icon">🧠</div>
    <h1>Vokabeltrainer</h1>
    <div class="start-subtitle">
      Lerne spanische Wörter direkt am Bild.<br>
      Wähle ein Thema und starte.
    </div>
    <div class="themenbox">
      <button class="ui-btn" id="startBtn">Strand</button>
    </div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <button class="ui-btn" id="backBtn">← Zurück</button>
  </div>

  <div>
    <button class="ui-btn mode-btn active" id="lernBtn">Lernmodus</button>
    <button class="ui-btn mode-btn" id="quizBtn">Quizmodus</button>
  </div>

  <div id="lernInfo">Tippe auf eine Pfeilspitze.</div>

  <div id="quizBox">
    <div id="frage"></div>
    <div id="feedback"></div>
  </div>

  <div class="bild">
    <img id="bild" src="strand-ohne-woerter.png" alt="Strandbild">
    <div id="hotspots"></div>
    <div id="label"></div>
  </div>
</div>

<script>
  let mode = "lernen";
  let gesucht = "";
  let letztesGesucht = "";
  let quizAktiv = false;
  let timer = null;

  const hotspots = [
    { wort:"el sol", clickX:70, clickY:26, width:8, height:8, labelX:74, labelY:22 },
    { wort:"la palmera", clickX:14, clickY:41, width:8, height:8, labelX:22, labelY:31 },
    { wort:"el mar", clickX:38, clickY:50, width:8, height:8, labelX:42, labelY:44 },
    { wort:"el barco", clickX:52, clickY:46, width:8, height:8, labelX:56, labelY:48 },
    { wort:"la ola", clickX:73, clickY:58, width:8, height:8, labelX:72, labelY:58 },
    { wort:"la tabla de surf", clickX:47, clickY:59, width:8, height:8, labelX:61, labelY:63 },
    { wort:"el bañador", clickX:38, clickY:71, width:8, height:8, labelX:56, labelY:68 },
    { wort:"la sombrilla", clickX:13, clickY:66, width:8, height:8, labelX:12, labelY:69 },
    { wort:"la toalla", clickX:12, clickY:86, width:8, height:8, labelX:18, labelY:90 },
    { wort:"las gafas de sol", clickX:36, clickY:90, width:8, height:8, labelX:41, labelY:92 },
    { wort:"la crema solar", clickX:60, clickY:87, width:8, height:8, labelX:66, labelY:89 },
    { wort:"la concha", clickX:90, clickY:90, width:8, height:8, labelX:86, labelY:90 },
    { wort:"el chiringuito", clickX:90, clickY:53, width:8, height:8, labelX:84, labelY:66 }
  ];

  const menu = document.getElementById("menu");
  const app = document.getElementById("app");
  const hotspotsLayer = document.getElementById("hotspots");
  const label = document.getElementById("label");
  const frage = document.getElementById("frage");
  const feedback = document.getElementById("feedback");
  const quizBox = document.getElementById("quizBox");
  const lernInfo = document.getElementById("lernInfo");
  const lernBtn = document.getElementById("lernBtn");
  const quizBtn = document.getElementById("quizBtn");

  document.getElementById("startBtn").addEventListener("click", start);
  document.getElementById("backBtn").addEventListener("click", zurueck);
  lernBtn.addEventListener("click", () => setMode("lernen"));
  quizBtn.addEventListener("click", () => setMode("quiz"));

  function start() {
    menu.style.display = "none";
    app.style.display = "block";
    buildHotspots();
  }

  function buildHotspots() {
    hotspotsLayer.innerHTML = "";

    hotspots.forEach(h => {
      const d = document.createElement("div");
      d.className = "hotspot";
      d.style.left = h.clickX + "%";
      d.style.top = h.clickY + "%";
      d.style.width = h.width + "%";
      d.style.height = h.height + "%";
      d.addEventListener("click", () => onHotspotClick(h, d));
      hotspotsLayer.appendChild(d);
    });
  }

  function setMode(neu) {
    mode = neu;
    clearTimeout(timer);
    timer = null;

    lernBtn.classList.toggle("active", neu === "lernen");
    quizBtn.classList.toggle("active", neu === "quiz");

    label.style.display = "none";
    feedback.textContent = "";
    feedback.className = "";

    if (neu === "lernen") {
      quizBox.style.display = "none";
      lernInfo.style.display = "block";
      quizAktiv = false;
    } else {
      quizBox.style.display = "block";
      lernInfo.style.display = "none";
      nextQuestion();
    }
  }

  function onHotspotClick(h, el) {
    if (mode === "lernen") {
      showLabel(h.wort, h.labelX, h.labelY);
      return;
    }

    if (!quizAktiv) return;

    if (h.wort === gesucht) {
      feedback.textContent = "Richtig";
      feedback.className = "richtig";
      timer = setTimeout(nextQuestion, 600);
    } else {
      feedback.textContent = "Falsch";
      feedback.className = "falsch";
      el.classList.add("fehler");
      setTimeout(() => el.classList.remove("fehler"), 300);
    }
  }

  function showLabel(text, x, y) {
    label.textContent = text;
    label.style.left = x + "%";
    label.style.top = y + "%";
    label.style.display = "block";
  }

  function nextQuestion() {
    let neu;
    do {
      neu = hotspots[Math.floor(Math.random() * hotspots.length)].wort;
    } while (neu === letztesGesucht);

    gesucht = neu;
    letztesGesucht = neu;

    frage.textContent = "Finde: " + gesucht;
    feedback.textContent = "";
    feedback.className = "";
    label.style.display = "none";
    quizAktiv = true;
  }

  function zurueck() {
    location.reload();
  }
</script>

</body>
</html>

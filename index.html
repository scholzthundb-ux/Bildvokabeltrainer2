
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vokabeltrainer</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  background: #eef3f8;
  color: #1f2a37;
}

/* ===== Buttons ===== */

.ui-btn {
  padding: 24px 36px;
  margin: 10px;
  border-radius: 22px;
  border: none;
  background: #2d7df6;
  color: white;
  font-size: 30px;
  font-weight: bold;
  cursor: pointer;
}

.image-square-btn {
  width: 70px;
  height: 70px;
  border-radius: 12px;
  border: none;
  background: #2d7df6;
  color: white;
  font-size: 28px;
  font-weight: bold;
}

/* ===== Layout ===== */

#menu, #folderMenu {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

#folderMenu, #app {
  display: none;
}

.card {
  background: white;
  width: 100%;
  max-width: 760px;
  border-radius: 26px;
  padding: 40px;
}

.folder-image-grid {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
}

/* ===== Bild ===== */

.bild {
  position: relative;
  width: 100vw;
}

#bild {
  width: 100%;
}

/* ===== HOTSPOTS ===== */

.hotspot {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 7.5%;
  height: 7.5%;
  cursor: pointer;
}

/* kleinere Hotspots nur für Körper */
.hotspot.small-hitbox {
  width: 4.2%;
  height: 4.2%;
}

/* ===== Label ===== */

#label {
  position: absolute;
  background: white;
  border: 3px solid black;
  border-radius: 16px;
  padding: 10px;
  font-size: 26px;
  display: none;
  transform: translate(-50%, -50%);
}
</style>
</head>

<body>

<!-- ===== START ===== -->

<div id="menu">
  <div class="card">
    <h1>Vokabeltrainer</h1>
    <div id="folderButtons"></div>
  </div>
</div>

<!-- ===== ORDNER ===== -->

<div id="folderMenu">
  <div class="card">
    <h2 id="folderMenuTitle"></h2>
    <div id="imageButtons" class="folder-image-grid"></div>
    <button class="ui-btn" onclick="backToStart()">Zurück</button>
  </div>
</div>

<!-- ===== APP ===== -->

<div id="app">

  <button onclick="backToFolderMenu()">←</button>

  <div class="bild">
    <img id="bild">
    <div id="hotspots"></div>
    <div id="label"></div>
  </div>

</div>

<script>

/* ===== DATEN ===== */

const folders = {

  la_playa: {
    title: "La playa",
    images: [
      {
        file: "strand-ohne-woerter.png",
        hotspots: [
          { wort:"el sol", clickX:70, clickY:26, labelX:74, labelY:22 },
          { wort:"la palmera", clickX:14, clickY:41, labelX:22, labelY:31 }
        ]
      }
    ]
  },

  el_cuerpo: {
    title: "El cuerpo",
    images: [
      {
        file: "la-cabeza-direcciones.png",
        hotspots: [
          { wort:"el pelo", clickX:31.8, clickY:11.7, labelX:20, labelY:8 },
          { wort:"la ceja", clickX:54, clickY:17, labelX:70, labelY:14 },
          { wort:"el ojo", clickX:31, clickY:22.3, labelX:17, labelY:20 },
          { wort:"la oreja", clickX:69, clickY:26.5, labelX:83, labelY:24 },
          { wort:"la nariz", clickX:54, clickY:76.9, labelX:72, labelY:76 },
          { wort:"la boca", clickX:40.5, clickY:38.8, labelX:20, labelY:42 },
          { wort:"la lengua", clickX:49.8, clickY:35, labelX:70, labelY:38 },
          { wort:"los labios", clickX:55, clickY:83.3, labelX:73, labelY:84 },
          { wort:"los dientes", clickX:50.5, clickY:31.6, labelX:71, labelY:32 },
          { wort:"la mejilla", clickX:36.8, clickY:30.4, labelX:18, labelY:31 },
          { wort:"la barbilla", clickX:39.8, clickY:89.1, labelX:19, labelY:90 },
          { wort:"el cuello", clickX:42.2, clickY:95, labelX:19, labelY:96 },
          { wort:"la frente", clickX:53.8, clickY:62, labelX:72, labelY:59 },
          { wort:"las pestañas", clickX:31, clickY:70.7, labelX:16, labelY:69 },
          { wort:"el párpado", clickX:64.8, clickY:69, labelX:82, labelY:68 },
          { wort:"la cabeza", clickX:27, clickY:55.6, labelX:16, labelY:52 }
        ]
      }
    ]
  }

};

/* ===== STATE ===== */

let currentFolderKey = null;
let currentImageIndex = 0;

/* ===== ELEMENTE ===== */

const menu = document.getElementById("menu");
const folderMenu = document.getElementById("folderMenu");
const app = document.getElementById("app");
const bild = document.getElementById("bild");
const hotspotsLayer = document.getElementById("hotspots");
const label = document.getElementById("label");

/* ===== START ===== */

renderFolderButtons();

function renderFolderButtons() {
  const container = document.getElementById("folderButtons");
  container.innerHTML = "";

  Object.keys(folders).forEach(key => {
    const btn = document.createElement("button");
    btn.className = "ui-btn";
    btn.textContent = folders[key].title;
    btn.onclick = () => openFolderMenu(key);
    container.appendChild(btn);
  });
}

/* ===== NAVIGATION ===== */

function openFolderMenu(key) {
  currentFolderKey = key;
  menu.style.display = "none";
  folderMenu.style.display = "flex";

  document.getElementById("folderMenuTitle").textContent =
    folders[key].title;

  renderImageButtons();
}

function backToStart() {
  folderMenu.style.display = "none";
  menu.style.display = "flex";
}

function backToFolderMenu() {
  app.style.display = "none";
  folderMenu.style.display = "flex";
}

/* ===== BILDER ===== */

function renderImageButtons() {
  const container = document.getElementById("imageButtons");
  container.innerHTML = "";

  folders[currentFolderKey].images.forEach((img, i) => {
    const btn = document.createElement("button");
    btn.className = "image-square-btn";
    btn.textContent = i + 1;
    btn.onclick = () => openImage(i);
    container.appendChild(btn);
  });
}

function openImage(index) {
  currentImageIndex = index;
  folderMenu.style.display = "none";
  app.style.display = "block";

  loadImage();
}

function loadImage() {
  const imgData = folders[currentFolderKey].images[currentImageIndex];
  bild.src = imgData.file;

  buildHotspots();
}

/* ===== HOTSPOTS ===== */

function buildHotspots() {
  hotspotsLayer.innerHTML = "";

  const hotspots = folders[currentFolderKey].images[currentImageIndex].hotspots;

  hotspots.forEach(h => {
    const d = document.createElement("div");
    d.className = "hotspot";

    // 🔥 HIER passiert die Magie
    if (currentFolderKey === "el_cuerpo") {
      d.classList.add("small-hitbox");
    }

    d.style.left = h.clickX + "%";
    d.style.top = h.clickY + "%";

    d.onclick = () => showLabel(h);

    hotspotsLayer.appendChild(d);
  });
}

/* ===== LABEL ===== */

function showLabel(h) {
  label.textContent = h.wort;
  label.style.left = h.labelX + "%";
  label.style.top = h.labelY + "%";
  label.style.display = "block";

  speak(h.wort);
}

/* ===== SOUND ===== */

function speak(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "es-ES";
  speechSynthesis.speak(u);
}

</script>

</body>
</html>

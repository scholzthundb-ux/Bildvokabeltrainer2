<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vokabeltrainer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      background: #f0f4f8;
      padding: 0 10px 30px;
    }

    h1 {
      margin: 20px 0;
      font-size: 28px;
    }

    #menu {
      padding: 20px 0;
    }

    .menu-btn, #back {
      padding: 12px 18px;
      margin: 8px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      background: #0d6efd;
      color: white;
      cursor: pointer;
    }

    .bild {
      position: relative;
      max-width: 900px;
      margin: 0 auto;
    }

    #bild {
      width: 100%;
      display: block;
    }

    #hotspots {
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    .hotspot {
      position: absolute;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 11;
    }

    /* 🔥 große Schrift */
    #label {
      position: absolute;
      display: none;
      background: white;
      border: 3px solid black;
      border-radius: 14px;
      padding: 14px 20px;

      font-size: clamp(24px, 6vw, 40px);
      font-weight: bold;

      transform: translate(-50%, -50%);
      z-index: 20;
      white-space: nowrap;

      box-shadow: 0 6px 14px rgba(0,0,0,0.4);
    }

    #app {
      display: none;
    }
  </style>
</head>

<body>

<h1>Vokabeltrainer</h1>

<div id="menu">
  <button class="menu-btn" onclick="ladeThema('strand')">Strand</button>
</div>

<div id="app">
  <button id="back" onclick="zurueck()">← Zurück</button>

  <div class="bild">
    <img id="bild" src="">
    <div id="hotspots"></div>
    <div id="label"></div>
  </div>
</div>

<script>
const themen = {
  strand: {
    image: "strand-ohne-woerter.png",
    hotspots: [

      /* 🔥 FIX: weiter unten + links */
      { wort:"el sol", x:74, y:26, left:68, top:26, width:10, height:10 },

      { wort:"la palmera", x:22, y:31, left:9, top:36, width:9, height:10 },

      { wort:"el mar", x:42, y:44, left:33, top:44, width:8, height:9 },

      { wort:"el barco", x:56, y:48, left:48, top:42, width:8, height:9 },

      { wort:"la ola", x:72, y:58, left:69, top:56, width:7, height:8 },

      { wort:"la tabla de surf", x:61, y:63, left:45, top:60, width:8, height:10 },

      { wort:"el bañador", x:56, y:68, left:37, top:71, width:9, height:9 },

      { wort:"la sombrilla", x:12, y:69, left:8, top:61, width:8, height:10 },

      { wort:"la toalla", x:18, y:90, left:8, top:86, width:8, height:9 },

      { wort:"las gafas de sol", x:41, y:92, left:34, top:87, width:8, height:8 },

      { wort:"la crema solar", x:66, y:89, left:55, top:85, width:8, height:8 },

      { wort:"la concha", x:86, y:90, left:90, top:87, width:7, height:8 },

      { wort:"el chiringuito", x:84, y:66, left:87, top:60, width:7, height:9 }

    ]
  }
};

function ladeThema(name) {
  const t = themen[name];

  document.getElementById("menu").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("bild").src = t.image;

  const h = document.getElementById("hotspots");
  h.innerHTML = "";

  t.hotspots.forEach(e => {
    const b = document.createElement("button");
    b.className = "hotspot";

    b.style.left = e.left + "%";
    b.style.top = e.top + "%";
    b.style.width = e.width + "%";
    b.style.height = e.height + "%";

    b.onclick = () => {
      const l = document.getElementById("label");
      l.textContent = e.wort;
      l.style.left = e.x + "%";
      l.style.top = e.y + "%";
      l.style.display = "block";
    };

    h.appendChild(b);
  });
}

function zurueck() {
  document.getElementById("app").style.display = "none";
  document.getElementById("menu").style.display = "block";
  document.getElementById("label").style.display = "none";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vokabeltrainer</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  background: #eef3f8;
}

.ui-btn {
  padding: 18px 28px;
  margin: 8px;
  border-radius: 18px;
  border: none;
  background: #2d7df6;
  color: white;
  font-size: 24px;
  font-weight: bold;
}

.mode-btn { font-size: 26px; }
.mode-btn.active { background: #0b57d0; }

#menu {
  min-height: 100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.start-card {
  background:white;
  padding:30px;
  border-radius:20px;
}

#app { display:none; }

.bild {
  position:relative;
  max-width:900px;
  margin:auto;
}

#bild {
  width:100%;
}

#hotspots {
  position:absolute;
  inset:0;
}

.hotspot {
  position:absolute;
  transform:translate(-50%,-50%);
}

.hotspot.fehler {
  background:red;
  opacity:0.3;
}

#label {
  position:absolute;
  background:white;
  padding:10px;
  border-radius:10px;
  font-size:28px;
  display:none;
}

.richtig { color:green; font-size:32px; font-weight:bold; }
.falsch { color:red; font-size:32px; font-weight:bold; }

@keyframes pop {
  0% {transform:scale(0.6);}
  100% {transform:scale(1);}
}

.feedback-anim {
  animation:pop 0.3s;
}
</style>
</head>

<body>

<div id="menu">
  <div class="start-card">
    <button class="ui-btn" onclick="start()">Strand</button>
  </div>
</div>

<div id="app">

<button class="ui-btn" onclick="zurueck()">←</button>

<div>
<button id="lernBtn" class="ui-btn mode-btn active" onclick="setMode('lernen')">Lernen</button>
<button id="quizBtn" class="ui-btn mode-btn" onclick="setMode('quiz')">Quiz</button>
</div>

<div id="frage"></div>
<div id="feedback"></div>

<div class="bild">
<img id="bild" src="strand-ohne-woerter.png?v=3">
<div id="hotspots"></div>
<div id="label"></div>
</div>

</div>

<script>

let mode="lernen";
let gesucht="";
let letztesGesucht="";
let quizAktiv=false;

const hotspots=[
{ wort:"el sol", clickX:70, clickY:26, labelX:74, labelY:22, boost:1 },
{ wort:"la palmera", clickX:14, clickY:41, labelX:22, labelY:31, boost:1 },
{ wort:"el mar", clickX:41, clickY:48, labelX:42, labelY:44, boost:1 },
{ wort:"el barco", clickX:50, clickY:44, labelX:56, labelY:48, boost:1 },
{ wort:"la ola", clickX:73, clickY:58, labelX:72, labelY:58, boost:1 },
{ wort:"la tabla de surf", clickX:47, clickY:59, labelX:61, labelY:63, boost:1 },
{ wort:"el bañador", clickX:38, clickY:71, labelX:56, labelY:68, boost:1 },
{ wort:"la sombrilla", clickX:13, clickY:66, labelX:12, labelY:69, boost:1 },
{ wort:"la toalla", clickX:12, clickY:86, labelX:18, labelY:90, boost:1 },
{ wort:"las gafas de sol", clickX:36, clickY:90, labelX:41, labelY:92, boost:1 },
{ wort:"la crema solar", clickX:60, clickY:87, labelX:66, labelY:89, boost:1 },
{ wort:"la concha", clickX:90, clickY:90, labelX:86, labelY:90, boost:1 },
{ wort:"el chiringuito", clickX:90, clickY:53, labelX:84, labelY:66, boost:1 }
];

function start(){
document.getElementById("menu").style.display="none";
document.getElementById("app").style.display="block";
build();
}

function build(){
const c=document.getElementById("hotspots");
c.innerHTML="";

hotspots.forEach(h=>{
let d=document.createElement("div");
d.className="hotspot";
d.style.left=h.clickX+"%";
d.style.top=h.clickY+"%";
d.style.width="8%";
d.style.height="8%";

d.onclick=()=>click(h,d);
c.appendChild(d);
});
}

function setMode(m){
mode=m;
document.getElementById("feedback").textContent="";
if(m==="quiz") next();
}

function click(h,el){

if(mode==="lernen"){
let l=document.getElementById("label");
l.textContent=h.wort;
l.style.left=h.labelX+"%";
l.style.top=h.labelY+"%";
l.style.display="block";
return;
}

if(h.wort===gesucht){
feedback.textContent="👍 Richtig";
feedback.className="richtig feedback-anim";
h.boost=Math.max(1,h.boost-1);
setTimeout(next,600);
}else{
feedback.textContent="👎 Falsch";
feedback.className="falsch feedback-anim";

if(navigator.vibrate) navigator.vibrate(150);

let ziel=hotspots.find(x=>x.wort===gesucht);
ziel.boost=Math.min(8,ziel.boost+2);

el.classList.add("fehler");
setTimeout(()=>el.classList.remove("fehler"),300);
}
}

function next(){

let pool=hotspots.filter(h=>h.wort!==letztesGesucht);
let sum=pool.reduce((a,b)=>a+b.boost,0);
let r=Math.random()*sum;

for(let h of pool){
r-=h.boost;
if(r<=0){
gesucht=h.wort;
break;
}
}

letztesGesucht=gesucht;
document.getElementById("frage").textContent="Finde: "+gesucht;
}

function zurueck(){
location.reload();
}

</script>

</body>
</html>

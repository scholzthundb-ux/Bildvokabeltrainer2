<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vokabeltrainer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      background: #f0f4f8;
      padding: 0 10px 30px;
    }

    h1 {
      margin: 20px 0;
      font-size: 28px;
    }

    #menu {
      padding: 20px 0;
    }

    .menu-btn, #back {
      padding: 12px 18px;
      margin: 8px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      background: #0d6efd;
      color: white;
      cursor: pointer;
    }

    .bild {
      position: relative;
      max-width: 900px;
      margin: 0 auto;
    }

    #bild {
      width: 100%;
      display: block;
    }

    #hotspots {
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    .hotspot {
      position: absolute;
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
      z-index: 11;
    }

    .kreis {
      border-radius: 50%;
    }

    #label {
      position: absolute;
      display: none;
      background: white;
      border: 2px solid black;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 20px;
      font-weight: bold;
      transform: translate(-50%, -50%);
      z-index: 20;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }

    #app {
      display: none;
    }
  </style>
</head>
<body>

  <h1>Vokabeltrainer</h1>

  <div id="menu">
    <button class="menu-btn" onclick="ladeThema('strand')">Strand</button>
  </div>

  <div id="app">
    <button id="back" onclick="zurueck()">← Zurück</button>

    <div class="bild">
      <img id="bild" src="" alt="Bildvokabeln">
      <div id="hotspots"></div>
      <div id="label"></div>
    </div>
  </div>

  <script>
    const themen = {
      strand: {
        image: "strand-ohne-woerter.png",
        hotspots: [
          { wort:"el sol", left:65, top:12, width:12, height:12, x:78, y:18, kreis:true },
          { wort:"la palmera", left:9, top:36, width:9, height:10, x:22, y:31 },
          { wort:"el mar", left:33, top:44, width:8, height:9, x:42, y:40 },
          { wort:"el barco", left:48, top:42, width:8, height:9, x:56, y:31 },
          { wort:"la ola", left:69, top:56, width:7, height:8, x:72, y:58 },
          { wort:"la tabla de surf", left:45, top:60, width:8, height:10, x:61, y:63 },
          { wort:"el bañador", left:37, top:71, width:9, height:9, x:56, y:76 },
          { wort:"la sombrilla", left:8, top:61, width:8, height:10, x:18, y:69 },
          { wort:"la toalla", left:8, top:86, width:8, height:9, x:18, y:90 },
          { wort:"las gafas de sol", left:34, top:87, width:8, height:8, x:41, y:92 },
          { wort:"la crema solar", left:55, top:85, width:8, height:8, x:66, y:89 },
          { wort:"la concha", left:90, top:87, width:7, height:8, x:86, y:90 },
          { wort:"el chiringuito", left:87, top:60, width:7, height:9, x:84, y:66 }
        ]
      }
    };

    function ladeThema(name) {
      const thema = themen[name];
      if (!thema) return;

      document.getElementById("menu").style.display = "none";
      document.getElementById("app").style.display = "block";
      document.getElementById("bild").src = thema.image;

      const hotspots = document.getElementById("hotspots");
      hotspots.innerHTML = "";

      thema.hotspots.forEach(h => {
        const btn = document.createElement("button");
        btn.className = "hotspot" + (h.kreis ? " kreis" : "");
        btn.style.left = h.left + "%";
        btn.style.top = h.top + "%";
        btn.style.width = h.width + "%";
        btn.style.height = h.height + "%";

        btn.onclick = function () {
          const label = document.getElementById("label");
          label.textContent = h.wort;
          label.style.left = h.x + "%";
          label.style.top = h.y + "%";
          label.style.display = "block";
        };

        hotspots.appendChild(btn);
      });
    }

    function zurueck() {
      document.getElementById("app").style.display = "none";
      document.getElementById("menu").style.display = "block";
      document.getElementById("label").style.display = "none";
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vokabeltrainer</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  background: #eef3f8;
  color: #1f2a37;
}

h1 {
  margin: 0;
  font-size: 40px;
  font-weight: bold;
}

button {
  padding: 12px 20px;
  margin: 6px;
  border-radius: 14px;
  border: none;
  background: #2d7df6;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

button:active {
  transform: scale(0.98);
}

.mode-btn.active {
  background: #0b57d0;
}

#menu {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  box-sizing: border-box;
}

.start-card {
  background: white;
  width: 100%;
  max-width: 560px;
  border-radius: 26px;
  padding: 34px 24px 32px;
  box-shadow: 0 10px 28px rgba(0,0,0,0.12);
}

.start-icon {
  font-size: 54px;
  margin-bottom: 14px;
}

.start-subtitle {
  font-size: 20px;
  margin-top: 12px;
  margin-bottom: 26px;
  color: #4b5563;
  line-height: 1.4;
}

.themenbox button {
  font-size: 28px;
  padding: 20px 36px;
  border-radius: 18px;
  min-width: 220px;
}

#app {
  display: none;
  padding-bottom: 30px;
}

.topbar {
  padding-top: 16px;
}

.bild {
  position: relative;
  max-width: 900px;
  margin: auto;
}

#bild {
  width: 100%;
  display: block;
}

#hotspots {
  position: absolute;
  inset: 0;
  z-index: 10;
}

/* WICHTIG: Hotspots dürfen KEIN globales Button-Padding/Margin haben */
.hotspot {
  position: absolute;
  padding: 0;
  margin: 0;
  background: transparent;
  border: none;
  transform: translate(-50%, -50%);
  z-index: 11;
  cursor: pointer;
  box-shadow: none;
  min-width: 0;
}

.hotspot.fehler {
  background: rgba(255,0,0,0.3);
  border: 2px solid red;
  border-radius: 10px;
}

#label {
  position: absolute;
  background: white;
  border: 3px solid black;
  border-radius: 14px;
  padding: 14px 20px;
  font-size: clamp(24px, 6vw, 40px);
  font-weight: bold;
  transform: translate(-50%, -50%);
  display: none;
  z-index: 20;
  white-space: nowrap;
  box-shadow: 0 6px 14px rgba(0,0,0,0.4);
}

#quizBox {
  display: none;
}

#frage {
  font-size: 30px;
  margin: 10px;
  font-weight: bold;
}

#feedback {
  font-size: 28px;
  font-weight: bold;
  min-height: 36px;
}

.richtig {
  color: green;
}

.falsch {
  color: red;
}

#lernInfo {
  font-size: 22px;
  font-weight: bold;
  margin: 12px;
}
</style>
</head>

<body>

<div id="menu">
  <div class="start-card">
    <div class="start-icon">🧠</div>
    <h1>Vokabeltrainer</h1>
    <div class="start-subtitle">
      Lerne spanische Wörter direkt am Bild.<br>
      Wähle ein Thema und starte.
    </div>

    <div class="themenbox">
      <button onclick="start()">Strand</button>
    </div>
  </div>
</div>

<div id="app">

  <div class="topbar">
    <button onclick="zurueck()">← Zurück</button>
  </div>

  <div>
    <button id="lernBtn" class="mode-btn active" onclick="setMode('lernen')">Lernmodus</button>
    <button id="quizBtn" class="mode-btn" onclick="setMode('quiz')">Quizmodus</button>
  </div>

  <div id="lernInfo">Tippe auf eine Pfeilspitze.</div>

  <div id="quizBox">
    <div id="frage"></div>
    <div id="feedback"></div>
  </div>

  <div class="bild">
    <img id="bild" src="strand-ohne-woerter.png" alt="Strandbild">
    <div id="hotspots"></div>
    <div id="label"></div>
  </div>

</div>

<script>
let mode = "lernen";
let gesucht = "";
let letztesGesucht = "";
let quizAktiv = false;
let timer = null;

const hotspots = [
  { wort:"el sol", clickX:72, clickY:26, width:8, height:8, labelX:74, labelY:22 },
  { wort:"la palmera", clickX:16, clickY:43, width:8, height:8, labelX:22, labelY:31 },
  { wort:"el mar", clickX:38, clickY:50, width:8, height:8, labelX:42, labelY:44 },
  { wort:"el barco", clickX:52, clickY:46, width:8, height:8, labelX:56, labelY:48 },
  { wort:"la ola", clickX:71, clickY:60, width:8, height:8, labelX:72, labelY:58 },
  { wort:"la tabla de surf", clickX:47, clickY:63, width:8, height:8, labelX:61, labelY:63 },
  { wort:"el bañador", clickX:38, clickY:74, width:8, height:8, labelX:56, labelY:68 },
  { wort:"la sombrilla", clickX:16, clickY:66, width:8, height:8, labelX:12, labelY:69 },
  { wort:"la toalla", clickX:12, clickY:86, width:8, height:8, labelX:18, labelY:90 },
  { wort:"las gafas de sol", clickX:36, clickY:90, width:8, height:8, labelX:41, labelY:92 },
  { wort:"la crema solar", clickX:60, clickY:87, width:8, height:8, labelX:66, labelY:89 },
  { wort:"la concha", clickX:90, clickY:90, width:8, height:8, labelX:86, labelY:90 },
  { wort:"el chiringuito", clickX:88, clickY:56, width:8, height:8, labelX:84, labelY:66 }
];

function start() {
  document.getElementById("menu").style.display = "none";
  document.getElementById("app").style.display = "block";
  build();
}

function build() {
  const c = document.getElementById("hotspots");
  c.innerHTML = "";

  hotspots.forEach(h => {
    const b = document.createElement("button");
    b.className = "hotspot";
    b.style.left = h.clickX + "%";
    b.style.top = h.clickY + "%";
    b.style.width = h.width + "%";
    b.style.height = h.height + "%";
    b.onclick = () => clickHotspot(h, b);
    c.appendChild(b);
  });
}

function setMode(m) {
  mode = m;
  clearTimeout(timer);

  document.getElementById("lernBtn").classList.toggle("active", m === "lernen");
  document.getElementById("quizBtn").classList.toggle("active", m === "quiz");

  document.getElementById("label").style.display = "none";
  document.getElementById("feedback").textContent = "";

  if (m === "lernen") {
    document.getElementById("quizBox").style.display = "none";
    document.getElementById("lernInfo").style.display = "block";
    quizAktiv = false;
  } else {
    document.getElementById("quizBox").style.display = "block";
    document.getElementById("lernInfo").style.display = "none";
    next();
  }
}

function clickHotspot(h, btn) {
  if (mode === "lernen") {
    const l = document.getElementById("label");
    l.textContent = h.wort;
    l.style.left = h.labelX + "%";
    l.style.top = h.labelY + "%";
    l.style.display = "block";
    return;
  }

  if (!quizAktiv) return;

  if (h.wort === gesucht) {
    document.getElementById("feedback").textContent = "Richtig";
    document.getElementById("feedback").className = "richtig";
    timer = setTimeout(() => next(), 600);
  } else {
    document.getElementById("feedback").textContent = "Falsch";
    document.getElementById("feedback").className = "falsch";
    btn.classList.add("fehler");
    setTimeout(() => btn.classList.remove("fehler"), 300);
  }
}

function next() {
  let neu;
  do {
    neu = hotspots[Math.floor(Math.random() * hotspots.length)].wort;
  } while (neu === letztesGesucht);

  gesucht = neu;
  letztesGesucht = neu;

  document.getElementById("frage").textContent = "Finde: " + gesucht;
  document.getElementById("feedback").textContent = "";
  quizAktiv = true;
}

function zurueck() {
  location.reload();
}
</script>

</body>
</html>

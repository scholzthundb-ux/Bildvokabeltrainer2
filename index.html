<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vokabeltrainer</title>

<style>
body { font-family:Arial; text-align:center; margin:0; background:#f0f4f8; }
h1 { margin:20px; }

button {
  padding:10px 16px;
  margin:5px;
  border-radius:10px;
  border:none;
  background:#2d7df6;
  color:white;
  font-size:16px;
}

.mode-btn.active { background:#084298; }

.bild { position:relative; max-width:900px; margin:auto; }
#bild { width:100%; }

.hotspot {
  position:absolute;
  background:transparent;
  border:none;
}

.hotspot.fehler {
  background:rgba(255,0,0,0.3);
  border:2px solid red;
  border-radius:10px;
}

#label {
  position:absolute;
  background:white;
  border:3px solid black;
  border-radius:12px;
  padding:12px 18px;
  font-size:34px;
  font-weight:bold;
  transform:translate(-50%,-50%);
  display:none;
}

#quizBox { display:none; }
#frage { font-size:28px; margin:10px; }
#feedback { font-size:26px; font-weight:bold; }

.richtig { color:green; }
.falsch { color:red; }

</style>
</head>

<body>

<h1>Vokabeltrainer</h1>

<button onclick="start()">Strand</button>

<div id="app" style="display:none;">

<button onclick="zurueck()">← Zurück</button>

<div>
<button id="lernBtn" class="mode-btn active" onclick="setMode('lernen')">Lernmodus</button>
<button id="quizBtn" class="mode-btn" onclick="setMode('quiz')">Quizmodus</button>
</div>

<div id="lernInfo">Tippe auf einen Pfeil.</div>

<div id="quizBox">
<div id="frage"></div>
<div id="feedback"></div>
<button onclick="next()">Nächster Begriff</button>
</div>

<div class="bild">
<img id="bild" src="strand-ohne-woerter.png">
<div id="hotspots"></div>
<div id="label"></div>
</div>

</div>

<script>

let mode="lernen";
let gesuchtes="";
let aktiv=false;

const hotspots=[

// ☀️ Sonne
{ wort:"el sol", x:74,y:26,left:71,top:30,width:6,height:6 },

// 🌴 Palme
{ wort:"la palmera", x:22,y:31,left:12,top:40,width:6,height:6 },

// 🌊 Meer
{ wort:"el mar", x:42,y:44,left:38,top:48,width:6,height:6 },

// ⛵ Boot
{ wort:"el barco", x:56,y:48,left:52,top:45,width:6,height:6 },

// 🌊 Welle
{ wort:"la ola", x:72,y:58,left:70,top:58,width:6,height:6 },

// 🏄 Surfbrett
{ wort:"la tabla de surf", x:61,y:63,left:52,top:60,width:6,height:6 },

// 🩱 Badeanzug
{ wort:"el bañador", x:56,y:68,left:43,top:70,width:6,height:6 },

// ⛱️ Sonnenschirm
{ wort:"la sombrilla", x:12,y:69,left:12,top:63,width:6,height:6 },

// 🧺 Handtuch
{ wort:"la toalla", x:18,y:90,left:12,top:86,width:6,height:6 },

// 🕶️ Sonnenbrille
{ wort:"las gafas de sol", x:41,y:92,left:36,top:88,width:6,height:6 },

// 🧴 Sonnencreme
{ wort:"la crema solar", x:66,y:89,left:60,top:86,width:6,height:6 },

// 🐚 Muschel
{ wort:"la concha", x:86,y:90,left:88,top:88,width:6,height:6 },

// 🍹 Strandbar
{ wort:"el chiringuito", x:84,y:66,left:89,top:62,width:6,height:6 }

];

function start(){
document.querySelector("button").style.display="none";
document.getElementById("app").style.display="block";
build();
}

function build(){
const h=document.getElementById("hotspots");
h.innerHTML="";
hotspots.forEach(e=>{
let b=document.createElement("button");
b.className="hotspot";
b.style.left=e.left+"%";
b.style.top=e.top+"%";
b.style.width=e.width+"%";
b.style.height=e.height+"%";
b.onclick=()=>click(e,b);
h.appendChild(b);
});
}

function setMode(m){
mode=m;

document.getElementById("lernBtn").classList.toggle("active",m==="lernen");
document.getElementById("quizBtn").classList.toggle("active",m==="quiz");

document.getElementById("label").style.display="none";
document.getElementById("feedback").textContent="";

if(m==="lernen"){
document.getElementById("quizBox").style.display="none";
document.getElementById("lernInfo").style.display="block";
}
else{
document.getElementById("quizBox").style.display="block";
document.getElementById("lernInfo").style.display="none";
next();
}
}

function click(e,btn){

if(mode==="lernen"){
let l=document.getElementById("label");
l.textContent=e.wort;
l.style.left=e.x+"%";
l.style.top=e.y+"%";
l.style.display="block";
return;
}

if(!aktiv) return;

if(e.wort===gesuchtes){
document.getElementById("feedback").textContent="Richtig";
document.getElementById("feedback").className="richtig";
aktiv=false;
}
else{
document.getElementById("feedback").textContent="Falsch";
document.getElementById("feedback").className="falsch";
btn.classList.add("fehler");
setTimeout(()=>btn.classList.remove("fehler"),300);
}
}

function next(){
let i=Math.floor(Math.random()*hotspots.length);
gesuchtes=hotspots[i].wort;
document.getElementById("frage").textContent="Finde: "+gesuchtes;
document.getElementById("feedback").textContent="";
aktiv=true;
}

function zurueck(){
location.reload();
}

</script>

</body>
</html>
